<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>ireview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet"/>
  <style>
.back-link{font-family:"Fraunces",serif;font-weight:500;font-size:1.12rem;line-height:1.2}
    .back-link:hover{color:#0066cc;text-decoration:underline}:root{--bg:#fbfaf7;--ink:#1e1d1b;--muted:#8a857d;--rule:#e8e4dc;--link:#3b3f8f;--code-bg:#f1efe9;--star:#c9a227;--grid:#d7d0c4;--measure:760px;--season-bg:#2f80c3}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:"Newsreader",Georgia,serif;font-size:19px;line-height:1.7;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;padding:0 20px}
    .wrap{max-width:var(--measure);margin:0 auto;padding:32px 0 48px}
    .masthead{margin-bottom:26px}
    .masthead h1{font-family:"Fraunces",serif;font-weight:600;font-size:clamp(30px,6vw,44px);letter-spacing:-.02em;line-height:1.05;margin:0}
    .masthead p{margin:10px 0 0;color:var(--muted);font-style:italic;font-size:1.05rem}
    .masthead .rule{height:1px;background:var(--rule);border:0;margin:18px 0 0}h2.section{font-family:"Fraunces",serif;font-weight:600;font-size:1.5rem;letter-spacing:-.01em;margin:28px 0 10px}h2.section:first-of-type{margin-top:8px}table{width:100%;border-collapse:collapse;margin:0;border:1px solid var(--grid)}thead th{text-align:left;font-family:"Fraunces",serif;font-weight:600;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:#f3efe8;padding:6px 10px;border:1px solid var(--grid)}
    .read thead th:last-child{text-align:right}
    .read .book-row td{padding:9px 10px 4px;vertical-align:baseline;border:1px solid var(--grid);border-bottom:0}
    .read .book-row .t{font-family:"Fraunces",serif;font-weight:500;font-size:1.12rem;line-height:1.2}
    .read .book-row .a{color:var(--muted)}
    .read .book-row .s{text-align:right;white-space:nowrap}
    .read .detail-row td{padding:4px 10px 12px;border:1px solid var(--grid);border-top:0}
    .review{margin:.15em 0 .55em}
    .lines{list-style:none;margin:0;padding:0}
    .lines li{border-left:3px solid var(--rule);padding:1px 0 1px 14px;color:var(--muted);font-style:italic;margin:.35em 0}
    .stars .on{color:var(--star)}
    .stars .off{color:var(--rule)}.toread td{padding:12px;border:1px solid var(--grid)}
    .toread .t{font-family:"Fraunces",serif;font-weight:500}.toread .a{color:var(--muted)}
    .review a{color:var(--link);text-decoration:underline;text-underline-offset:2px}
    .review code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85em;background:var(--code-bg);padding:.1em .35em;border-radius:4px}
    .state{color:var(--muted);font-style:italic}
    .foot{margin-top:36px;padding-top:16px;border-top:1px solid var(--rule);color:var(--muted);font-size:.85rem}
    .cover-wrap{display:flex;align-items:center;gap:11px}.cover{width:34px;height:51px;object-fit:cover;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.28);background:var(--code-bg);flex:0 0 auto}
    @media(min-width:601px){html,body{height:100%;overflow:hidden}body{background:linear-gradient(145deg,#4d326f 0%,#7956a8 42%,#9b72c2 70%,#5c3d82 100%);padding:24px 28px;min-height:100vh}.wrap{width:min(1180px,100%);height:calc(100vh - 48px);max-width:none;margin:0 auto;padding:20px 42px 18px;background:#fff;border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.2);display:flex;flex-direction:column;overflow:hidden}.masthead{margin-bottom:10px;flex:0 0 auto;display:flex;align-items:center;gap:20px}.masthead h1{flex:0 0 auto}.masthead p{margin:0}.masthead .rule{display:none}.back-link{margin-left:auto}.#shelf{min-height:0;flex:1 1 auto;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding-right:0;scroll-padding-top:8px}#shelf{min-height:0;flex:1 1 auto;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding-right:0;scroll-padding-top:8px}h2.section{font-size:1.5rem;margin:22px 0 10px;scroll-margin-top:8px}.read{display:block;border:0;width:100%;table-layout:auto}.read thead{display:none}.read tbody{display:block;width:100%}.read .book-row{display:grid;grid-template-columns:minmax(0,55%) minmax(0,30%) minmax(0,15%);width:100%;margin:0;background:#fff;border:1px solid var(--grid);border-bottom:0;border-radius:16px 16px 0 0;overflow:hidden}.read .book-row td{display:flex;align-items:center;min-width:0;border:0;padding:16px 18px 14px}.read .book-row .t{grid-column:1}.read .book-row .a{grid-column:2}.read .book-row .s{grid-column:3;justify-content:flex-end;text-align:right}.read .detail-row{display:block;width:100%;margin:0 0 22px;background:#fff;border:1px solid var(--grid);border-top:0;overflow:hidden}.read .detail-row td{display:block;width:100%;padding:0 18px 18px;border:0}.toread{display:block;border:0;width:100%;table-layout:auto}.toread thead{display:none}.toread tbody{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%}.toread tr{display:block;min-width:0;width:100%;overflow:hidden;background:#fff;border:1px solid var(--grid);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:12px}.toread td{display:block;width:100%;min-width:0;border:0!important;padding:0!important;overflow-wrap:anywhere}.toread td.t .cover-wrap{display:block;width:100%;min-width:0}.toread td.t .cover{display:block;width:min(78%,230px);height:auto;aspect-ratio:2/3;margin:0 auto;object-fit:cover;border-radius:7px;box-shadow:0 2px 7px rgba(73,47,105,.2);border:1px solid #c8b1df}.toread td.t .ttl{display:block;margin-top:9px;font-family:"Fraunces",serif;font-size:13px;font-weight:700;line-height:1.18;overflow-wrap:anywhere}.toread td.a{margin-top:4px;font-size:13px;font-weight:400;line-height:1.2;color:var(--muted);overflow-wrap:anywhere}.foot{display:none}}
@media(max-width:600px){body{font-size:18px;background:var(--season-bg);padding:12px 10px;min-height:100vh;overflow:hidden}.wrap{width:100%;max-width:none;height:calc(100vh - 24px);margin:0 auto;padding:20px 16px 20px;background:#fff;border-radius:26px;box-shadow:0 10px 30px rgba(0,0,0,.18);overflow:hidden;display:flex;flex-direction:column}.masthead{margin-bottom:12px;flex:0 0 auto;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}.masthead h1{font-size:clamp(28px,9vw,38px)}.masthead p{margin:0;font-size:.92rem}.masthead .rule{display:none}#shelf{min-height:0;flex:1 1 auto;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding-right:2px}h2.section{font-size:1.3rem;margin:18px 0 8px}.read .book-row td,.toread td{padding-left:6px;padding-right:6px}.read .book-row .t{font-size:1rem}.cover-wrap{gap:7px}.toread{display:block;border:0}.toread thead{display:none}.toread tbody{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.toread tr{display:block;background:#fff;border:1px solid var(--grid);border-radius:12px;padding:9px;box-shadow:0 2px 8px rgba(0,0,0,.08);overflow:hidden}.toread td{display:block;width:100%;border:0!important;padding:0!important}.toread td.t .cover-wrap{display:block}.toread td.t .cover{display:block;width:88%;height:auto;aspect-ratio:2/3;margin:0 auto;box-shadow:none}.toread td.t .ttl{display:block;margin-top:7px;font-family:"Fraunces",serif;font-size:13px;line-height:1.18;text-align:center;overflow-wrap:anywhere}.toread td.a{margin-top:3px;font-size:12px;line-height:1.2;text-align:center;overflow-wrap:anywhere}.read{font-size:16px}.foot{margin-top:12px;padding-top:8px;flex:0 0 auto}}
</style>
</head>
  <body>
    <div class="wrap">
      <header class="masthead"><h1>Reviews</h1><p></p>
        <a class="back-link" href="https://tarelab.com/TTTMrgf8782ojojt">Return</a>
      </header>
      <main id="shelf"><p class="state">Loading the shelf…</p>
      </main>
      <footer class="foot">
        </footer>
    </div><script>(()=>{const shelf=document.getElementById('shelf');const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
                        function coverImg(isbn){if(!isbn)return '<img class="cover" src="https://dryofg8nmyqjw.cloudfront.net/images/no-cover.png" alt="No cover available" loading="lazy">';const clean=isbn.replace(/[^0-9Xx]/g,'');const url='https://covers.openlibrary.org/b/isbn/'+clean+'-M.jpg?default=false';return '<img class="cover" src="'+url+'" alt="" loading="lazy" data-isbn="'+clean+'" onerror="__gbCover(this)">'}window.__gbCover=function(img){img.onerror=function(){img.remove()};const isbn=img.getAttribute('data-isbn');if(!isbn){img.remove();return}fetch('https://www.googleapis.com/books/v1/volumes?q=isbn:'+encodeURIComponent(isbn)).then(r=>r.json()).then(d=>{const info=d&&d.items&&d.items[0]&&d.items[0].volumeInfo;const t=info&&info.imageLinks&&(info.imageLinks.thumbnail||info.imageLinks.smallThumbnail);if(t)img.src=t.replace(/^http:\/\//i,'https://');else img.remove()}).catch(()=>img.remove())};
                        function stars(v){if(v===undefined||v===null||String(v).trim()==='')return '<span class="stars off" aria-label="not yet rated">—</span>';let n=parseInt(v,10);if(isNaN(n))n=0;n=Math.max(0,Math.min(5,n));let out='';for(let i=1;i<=5;i++)out+='<span class="'+(i<=n?'on':'off')+'">★</span>';return '<span class="stars" aria-label="'+n+' out of 5 stars">'+out+'</span>'}
                        function parse(text){const lines=text.replace(/\r\n/g,'\n').split('\n');const read=[],toreadLists=[];let mode=null,curBook=null,curList=null;const flush=()=>{if(curBook){curBook.review=curBook.reviewLines.join(' ').trim();read.push(curBook);curBook=null}};for(const raw of lines){const line=raw.replace(/\s+$/,'');const sec=line.match(/^#\s+(.*)/);if(sec){flush();const heading=sec[1].trim();if(heading.toLowerCase()==='read'){mode='read';curList=null}else{mode='toread';curList={title:heading,items:[]};toreadLists.push(curList)}continue}if(mode==='read'){const bk=line.match(/^##\s+(.*)/);if(bk){flush();const p=bk[1].split('|').map(s=>s.trim());curBook={title:p[0]||'',author:p[1]||'',stars:p[2]||'',isbn:p[3]||'',reviewLines:[],lines:[]};continue}if(!curBook)continue;const fav=line.match(/^\s*-\s+(.*)/);if(fav){curBook.lines.push(fav[1].trim());continue}if(line.trim()==='')continue;curBook.reviewLines.push(line.trim())}else if(mode==='toread'){if(line.trim()===''||!curList)continue;const p=line.split('|').map(s=>s.trim());curList.items.push({title:p[0]||'',author:p[1]||'',isbn:p[2]||''})}}flush();return{read,toreadLists}}
                        function render({read,toreadLists}){const anyToread=toreadLists.some(l=>l.items.length);if(!read.length&&!anyToread){shelf.innerHTML='<p class="state">No books yet — add some in ireview.md.</p>';return}let h='';if(read.length){h+='<h2 class="section">Read</h2><table class="read"><thead><tr><th>Book</th><th>Author</th><th>Rating</th></tr></thead><tbody>';read.forEach(b=>{h+='<tr class="book-row"><td class="t"><span class="cover-wrap">'+coverImg(b.isbn)+'<span class="ttl">'+esc(b.title)+'</span></span></td><td class="a">'+esc(b.author)+'</td><td class="s">'+stars(b.stars)+'</td></tr>';if(b.review||b.lines.length){h+='<tr class="detail-row"><td colspan="3">';if(b.review)h+='<p class="review">'+inline(b.review)+'</p>';if(b.lines.length)h+='<ul class="lines">'+b.lines.map(l=>'<li>'+inline(l)+'</li>').join('')+'</ul>';h+='</td></tr>'}});h+='</tbody></table>'}toreadLists.forEach(list=>{if(!list.items.length)return;h+='<h2 class="section">'+esc(list.title)+'</h2><table class="toread"><thead><tr><th>Title</th><th>Author</th></tr></thead><tbody>';list.items.forEach(b=>{h+='<tr><td class="t"><span class="cover-wrap">'+coverImg(b.isbn)+'<span class="ttl">'+esc(b.title)+'</span></span></td><td class="a">'+esc(b.author)+'</td></tr>'});h+='</tbody></table>'});shelf.innerHTML=h}fetch('ireview.md?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(t=>render(parse(t))).catch(err=>{shelf.innerHTML='<p class="state">Couldn’t load <b>ireview.md</b> ('+esc(err.message)+').<br>If you opened this file straight from your computer, browsers block that — view it on your live site. Make sure ireview.md sits in the same folder as this page.</p>'})})();
      </script>
  </body>
