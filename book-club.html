<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/moonfavicon.svg">
<style>
:root{--bg:#f7f4ef;--ink:#252321;--muted:#77716b;--line:#ded8d0;--accent:#6d4f8b;--card:#fffdf9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "DM Sans",sans-serif}main{max-width:1100px;margin:0 auto;padding:42px 22px 70px}h1,h2{font-family:"Playfair Display",serif}h1{font-size:42px;margin:0 0 8px}h2{font-size:27px;margin:0}.intro{color:var(--muted);margin:0 0 30px}.section{margin:34px 0}.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:12px}.table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:680px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}tr:last-child td{border-bottom:0}.book-cell{display:flex;align-items:center;gap:13px}.cover,.cover-ph{width:52px;height:76px;border-radius:5px;object-fit:cover;display:block}.cover-ph{background:#e8e1d8;color:#756d64;font-size:10px;line-height:1.2;padding:7px;text-align:center;display:flex;align-items:center;justify-content:center}.book-cell a{text-decoration:none;color:inherit}.title{font-weight:600}.meta{color:var(--muted);font-size:13px}.state{padding:22px;color:var(--muted)}.error{background:#fff4f1;border:1px solid #e7c9c1;border-radius:12px;padding:16px}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>Book Club</h1>
<p class="intro">Our reading lists, ratings, and what we’re reading next.</p>
<div id="shelf"><p class="state">Loading books…</p></div>
</main>
<script>
const READERS=['RGF','LAB'];
const DATA_URL=new URL('books.md',window.location.href).href;
const GOODREADS='https://www.goodreads.com/search?q=';

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function coverImg(isbn,title){
  const clean=String(isbn||'').replace(/[^0-9Xx]/g,'');
  const t=esc(title||'');
  if(!clean)return '<div class="cover-ph">No cover</div>';
  const gr=GOODREADS+encodeURIComponent(clean);
  const url='https://covers.openlibrary.org/b/isbn/'+encodeURIComponent(clean)+'-M.jpg?default=false';
  return '<a href="'+gr+'" target="_blank" rel="noopener noreferrer" aria-label="Search Goodreads for '+t+'">'+
    '<img class="cover" src="'+url+'" alt="'+t+' cover" loading="lazy" data-isbn="'+clean+'" onerror="bookPlaceholder(this)">'+
    '</a>';
}
function bookPlaceholder(img){
  const d=document.createElement('div');
  d.className='cover-ph';
  d.textContent=img.dataset.isbn||'No cover';
  img.replaceWith(d);
}
function parse(text){
  const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/);
  const blocks=[];let current=null,book=null;
  for(const raw of lines){
    const line=raw.trim();
    if(!line)continue;
    if(/^#\s+/.test(line)){
      current={type:/^#\s+Read\s*$/i.test(line)?'read':'list',title:line.replace(/^#\s+/,'').trim(),items:[]};
      blocks.push(current);book=null;continue;
    }
    if(current?.type==='read'){
      if(/^##\s+/.test(line)){
        const parts=line.replace(/^##\s+/,'').split('|').map(x=>x.trim());
        // Read format: title | author | RGF rating | LAB rating | ISBN
        current.items.push({title:parts[0]||'Untitled',author:parts[1]||'',rgf:parts[2]||'',lab:parts[3]||'',isbn:parts[4]||''});
      }
      continue;
    }
    if(current?.type==='list'){
      // To-read entries are plain pipe-delimited lines, not necessarily Markdown bullets.
      const parts=line.replace(/^[-*]\s+/,'').split('|').map(x=>x.trim());
      if(parts.length>=2){
        current.items.push({title:parts[0].replace(/\s+\*\*$/,'').trim(),author:parts[1]||'',isbn:parts[2]||'',priority:/\*\*$/.test(parts[0])});
      }else if(/^[-*]\s+/.test(line)){
        current.items.push({title:line.replace(/^[-*]\s+/,''),author:'',isbn:''});
      }
    }
  }
  return blocks;
}
function render(blocks){
  const shelf=document.getElementById('shelf');
  if(!blocks.length){shelf.innerHTML='<p class="state">No book lists found in books.md.</p>';return;}
  shelf.innerHTML=blocks.map(block=>{
    if(block.type==='read'){
      const rows=block.items.map(b=>'<tr><td><div class="book-cell">'+coverImg(b.isbn,b.title)+'<div><div class="title">'+esc(b.title)+'</div><div class="meta">'+esc(b.author)+(b.isbn?' · '+esc(b.isbn):'')+'</div></div></div></td><td>'+(b.rgf?'<span class="pill">RGF: '+esc(b.rgf)+'</span>':'—')+'</td><td>'+(b.lab?'<span class="pill">LAB: '+esc(b.lab)+'</span>':'—')+'</td></tr>').join('');
      return '<section class="section"><div class="section-head"><h2>'+esc(block.title)+'</h2><span class="pill">'+block.items.length+' books</span></div><div class="table-wrap"><table><thead><tr><th>Book</th><th>RGF</th><th>LAB</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>';
    }
    const rows=block.items.map(b=>'<tr><td><div class="book-cell">'+coverImg(b.isbn,b.title)+'<div><div class="title">'+esc(b.title)+(b.priority?' <span class="pill">priority</span>':'')+'</div><div class="meta">'+esc(b.author)+(b.isbn?' · '+esc(b.isbn):'')+'</div></div></div></td></tr>').join('');
    return '<section class="section"><div class="section-head"><h2>'+esc(block.title)+'</h2><span class="pill">'+block.items.length+' books</span></div><div class="table-wrap"><table><thead><tr><th>Book</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>';
  }).join('');
}
async function loadBooks(){
  const shelf=document.getElementById('shelf');
  try{
    const r=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const text=await r.text();
    render(parse(text));
  }catch(err){
    console.error('Book Club load failed:',err,DATA_URL);
    shelf.innerHTML='<div class="error"><strong>Couldn’t load books.md.</strong><br>'+esc(err.message)+'<br><small>Expected file: '+esc(DATA_URL)+'</small></div>';
  }
}
loadBooks();
</script>
</body>
</html>
