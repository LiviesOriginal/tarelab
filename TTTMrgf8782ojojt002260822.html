<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#05030a"/><title>Poems</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><link rel="icon" type="image/svg+xml" href="/moonfavicon.svg"><style>
:root{--bg:#fbfaf7;--ink:#1e1d1b;--muted:#8a857d;--rule:#e8e4dc;--link:#3b3f8f;--code-bg:#f1efe9;--measure:680px}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:"Newsreader",Georgia,serif;font-size:19px;line-height:1.75;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;padding:0 20px}.wrap{max-width:var(--measure);margin:0 auto;padding:64px 0 96px}.masthead{margin-bottom:52px}.masthead h1{font-family:"Fraunces",serif;font-weight:600;font-size:clamp(30px,6vw,44px);letter-spacing:-.02em;line-height:1.05;margin:0}.masthead p{margin:10px 0 0;color:var(--muted);font-style:italic;font-size:1.05rem}.masthead .rule{height:1px;background:var(--rule);border:0;margin:32px 0 0}.post{padding:8px 0 40px}.post+.post{border-top:1px solid var(--rule);padding-top:40px}.post-title{font-family:"Fraunces",serif;font-weight:500;font-size:clamp(23px,4vw,31px);letter-spacing:-.01em;line-height:1.15;margin:0 0 6px}.post-date{margin:0 0 20px;color:var(--muted);font-style:italic;font-size:.92rem}.post-body>*:first-child{margin-top:0}.post-body p{margin:0 0 1.15em}.post-body h2,.post-body h3,.post-body h4{font-family:"Fraunces",serif;font-weight:600;line-height:1.25;margin:1.6em 0 .5em;letter-spacing:-.01em}.post-body h2{font-size:1.35rem}.post-body h3{font-size:1.15rem}.post-body h4{font-size:1rem}.post-body a{color:var(--link);text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}.post-body a:hover{text-decoration-thickness:2px}.post-body strong{font-weight:600}.post-body em{font-style:italic}.post-body ul,.post-body ol{margin:0 0 1.15em;padding-left:1.4em}.post-body li{margin:.25em 0}.post-body blockquote{margin:1.3em 0;padding:2px 0 2px 20px;border-left:3px solid var(--rule);color:var(--muted);font-style:italic}.post-body code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.85em;background:var(--code-bg);padding:.12em .38em;border-radius:4px}.post-body pre{background:var( .foot .rule{height:1px;background:var(--rule);border:0;margin:0 0 8px}
.post-navigation{display:flex;align-items:center;justify-content:space-between;gap:12px}
.post-navigation button{border:0;padding:4px 0;background:none;color:var(--link);font:inherit;cursor:pointer}
.post-navigation button:hover:not(:disabled){text-decoration:underline;text-underline-offset:3px}
.post-navigation button:disabled{color:var(--muted);cursor:default;opacity:.55}
.post-navigation button:focus-visible{outline:2px solid var(--link);outline-offset:3px}
.post-position{color:var(--muted);font-size:.75rem}

/* ===== ALL DEVICES: fixed background image + off-center solid dark text box ===== */
:root{
  --box-left:5%;     /* image visible on the left */
  --box-w:75%;       /* text box width (right image = 100 - left - width = 20%) */
  --box-max:860px;   /* caps the box on very wide screens */
  --box-top:max(14px,env(safe-area-inset-top,0px));
  --box-bottom:max(14px,env(safe-area-inset-bottom,0px));
  --bg:#05030a;--ink:#f1eee8;--muted:#a9a49b;--rule:#2a2633;--link:#9fa6ff;--code-bg:#1a1722;
}
html,body{height:100%;overflow:hidden}
body{padding:0;background:#05030a}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:#05030a url("./poems-bg.jpg") 50% 50%/cover no-repeat}
.wrap{position:fixed;left:var(--box-left);top:var(--box-top);width:min(var(--box-w),var(--box-max));height:calc(100vh - var(--box-top) - var(--box-bottom));max-width:none;margin:0;padding:36px 40px 22px;background:#0d0b12;color:var(--ink);border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.55);overflow:hidden;display:flex;flex-direction:column;overflow-wrap:break-word}
@supports(height:1svh){.wrap{height:calc(100svh - var(--box-top) - var(--box-bottom))}}
.masthead{margin-bottom:28px;flex:0 0 auto}
.masthead .rule{margin-top:22px}
#feed{min-height:0;flex:1 1 auto;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding-right:6px;scrollbar-width:thin;scrollbar-color:#3a3547 transparent}
.post{padding:2px 0 32px}
.post+.post{padding-top:32px}
.post-body pre{max-width:100%}
.foot{margin-top:14px;padding-top:12px;flex:0 0 auto}

body{font-family:"Manrope",system-ui,sans-serif}
.masthead h1,.post-title,.post-body h2,.post-body h3,.post-body h4{font-family:"Manrope",system-ui,sans-serif;letter-spacing:-.045em}
body{font-size:18px}
.masthead h1{font-size:clamp(28px,5vw,40px)}
.post-title{font-size:clamp(21px,3.5vw,28px)}
.post-body h2{font-size:1.3rem}
.post-body h3{font-size:1.1rem}
.post-body h4{font-size:.95rem}
.wrap{padding:18px 20px 12px;border-radius:0}
.masthead{margin-bottom:14px}
.masthead .rule{margin-top:10px}

@media(min-width:601px){
:root{--box-left:2.5%;--box-w:45%}
body{font-size:15px}
.masthead h1{font-size:clamp(24px,4vw,32px)}
.post-title{font-size:clamp(18px,2.8vw,22px)}
.post-body h2{font-size:19px}
.post-body h3{font-size:17px}
.post-body h4{font-size:15px}
.wrap{top:-10px;height:calc(100vh + 20px)}
@supports(height:1svh){.wrap{height:calc(100svh + 20px)}}
}

/* ===== PHONES ===== */
@media(max-width:600px){
body:before{background-image:url("./poems-bg-mobile.jpg");background-position:50% 50%}
:root{--box-left:2.5%;--box-w:80%}
body{font-size:14px;line-height:1.65}
.wrap{padding:12px 10px 10px 16px;border-radius:0}
 .wrap{height:calc(100vh - var(--box-top) + 24px)}
@supports(height:1svh){.wrap{height:calc(100svh - var(--box-top) + 24px)}}
 .foot{display:none}
.masthead{margin-bottom:8px;display:flex;align-items:baseline;gap:4px 8px;flex-wrap:wrap}
.masthead h1{font-size:24px}
.masthead p{margin:0;font-size:.85rem}
.masthead .rule{display:none}
#feed{padding-right:2px}
.post{padding:2px 0 22px}
.post+.post{padding-top:22px}
.post-title{font-size:18px}
.post-date{font-size:13px;margin-bottom:12px}
.post-body p{margin-bottom:1em}
.post-body h2{font-size:1.15rem}.post-body h3{font-size:1.05rem}.post-body h4{font-size:1rem}
.post-body ul,.post-body ol{padding-left:1.2em}
.post-body blockquote{padding-left:12px}
.post-body pre{padding:12px}
}
