(()=>{const feed=document.getElementById('feed'),esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'),inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');function mdToHtml(md){const lines=md.replace(/\r\n/g,'\n').split('\n');let out='',i=0;const isBreak=l=>/^\s*$/.test(l)||/^```/.test(l)||/^#{1,4}\s/.test(l)||/^>\s?/.test(l)||/^\s*[-*]\s+/.test(l)||/^\s*\d+\.\s+/.test(l);while(i<lines.length){const line=lines[i];if(/^```/.test(line)){const code=[];i++;while(i<lines.length&&!/^```/.test(lines[i]))code.push(lines[i++]);i++;out+='<pre><code>'+esc(code.join('\n'))+'</code></pre>';continue}if(/^\s*$/.test(line)){i++;continue}const h=line.match(/^(#{1,4})\s+(.*)$/);if(h){const lv=Math.min(h[1].length+1,4);out+='<h'+lv+'>'+inline(h[2])+'</h'+lv+'>';i++;continue}if(/^>\s?/.test(line)){const q=[];while(i<lines.length&&/^>\s?/.test(lines[i]))q.push(lines[i++].replace(/^>\s?/,''));out+='<blockquote>'+inline(q.join(' '))+'</blockquote>';continue}if(/^\s*[-*]\s+/.test(line)){const it=[];while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i]))it.push(lines[i++].replace(/^\s*[-*]\s+/,''));out+='<ul>'+it.map(t=>'<li>'+inline(t)+'</li>').join('')+'</ul>';continue}if(/^\s*\d+\.\s+/.test(line)){const it=[];while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i]))it.push(lines[i++].replace(/^\s*\d+\.\s+/,''));out+='<ol>'+it.map(t=>'<li>'+inline(t)+'</li>').join('')+'</ol>';continue}const p=[];while(i<lines.length&&!isBreak(lines[i]))p.push(lines[i++]);out+='<p>'+inline(p.join('\n')).replace(/\n/g,'<br>')+'</p>'}return out}function parsePost(chunk){const lines=chunk.replace(/\r\n/g,'\n').replace(/^\n+|\n+$/g,'').split('\n');let title='',date='',idx=0;if(lines[0]&&/^#\s+/.test(lines[0])){title=lines[0].replace(/^#\s+/,'').trim();idx=1;while(idx<lines.length&&/^\s*$/.test(lines[idx]))idx++;if(idx<lines.length&&lines[idx].trim()&&!/^#{1,4}\s/.test(lines[idx])){date=lines[idx].trim();idx++}}return{title,date,body:lines.slice(idx).join('\n').trim()}}fetch('posts.md?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(text=>{const posts=text.trim().split(/\n-{3,}\n/).map(parsePost).filter(p=>p.title||p.body);if(!posts.length){feed.innerHTML='<p class="state">No posts yet. Add one in posts.md.</p>';return}feed.innerHTML=posts.map(p=>'<article class="post">'+(p.title?'<h2 class="post-title">'+esc(p.title)+'</h2>':'')+(p.date?'<p class="post-date">'+esc(p.date)+'</p>':'')+'<div class="post-body">'+mdToHtml(p.body)+'</div></article>').join('')}).catch(err=>{feed.innerHTML='<p class="state">Couldn’t load <b>posts.md</b> ('+esc(err.message)+').<br>If you opened this file straight from your computer, browsers block that — view it on your live site, or run a local server. Make sure posts.md sits in the same folder as this page.</p>'})})();
