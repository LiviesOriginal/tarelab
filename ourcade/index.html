<!doctype html>
<html lang="en">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-3PM570SXPX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push(["js", new Date()]);
  window.dataLayer.push(["config", "G-3PM570SXPX"]);
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07020d">
<title>OURCADE</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;overflow-x:hidden;background:#05030a;color:#fff;font-family:Inter,system-ui,sans-serif}
body:before{content:"";position:fixed;inset:0;z-index:-3;background:url("./ourcade-room.webp") center top/cover no-repeat}
body:after{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(3,2,9,.04),rgba(3,2,9,.08) 50%,rgba(3,2,9,.38) 100%);pointer-events:none}
.page{width:min(1500px,100%);margin:auto;padding:16px 18px 80px}
.hero{min-height:250px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}
.logo{margin:0;font-size:clamp(54px,9vw,124px);font-weight:950;letter-spacing:.04em;line-height:.8;color:#fff;text-shadow:0 0 4px #fff,0 0 13px #ff1bd8,0 0 32px #ff1bd8,0 0 70px rgba(255,27,216,.7)}
.tagline{margin-top:22px;padding:7px 18px;border:2px solid #20c8ff;background:rgba(4,2,13,.58);font-size:clamp(11px,1.5vw,17px);font-weight:900;letter-spacing:.2em;box-shadow:0 0 8px #20c8ff,0 0 24px rgba(32,200,255,.55)}
.game-grid{width:min(1380px,100%);margin:230px auto 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 16px;align-items:end}
.cabinet-link{display:block;color:#fff;text-decoration:none;touch-action:manipulation}
.cabinet{position:relative;transition:transform .2s ease,filter .2s ease}
.cabinet:hover{transform:translateY(-8px);filter:brightness(1.06) drop-shadow(0 18px 22px rgba(0,0,0,.75))}
.cabinet-art{width:100%;height:auto;display:block;filter:drop-shadow(0 18px 16px rgba(0,0,0,.72));clip-path:polygon(10% 0,97% 0,97% 89%,94% 93%,90% 94%,13% 94%,10% 92%,9% 89%);margin-bottom:-6%}.cabinet--couplet .cabinet-art,.cabinet--oracle .cabinet-art,.cabinet--falltoss .cabinet-art{clip-path:polygon(10% 0,96% 0,96% 90%,93% 94%,89% 95%,13% 95%,9% 93%,8% 90%);margin-bottom:-5%}
.cabinet-meta{text-align:center;margin-top:-4px;position:relative}
.subtitle{display:block;color:rgba(255,255,255,.78);font-size:11px;letter-spacing:.12em;text-transform:uppercase;text-shadow:0 2px 6px #000}
.play{display:inline-block;margin-top:6px;padding:6px 15px;border:1px solid #20c8ff;border-radius:999px;background:rgba(4,2,12,.8);font-size:10px;font-weight:900;letter-spacing:.16em;box-shadow:0 0 10px rgba(32,200,255,.55)}
@media(max-width:900px){.page{padding:8px 12px 64px}.hero{min-height:210px}.game-grid{margin-top:190px;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}}
@media(max-width:600px){.game-grid{margin-top:150px;grid-template-columns:minmax(0,430px);justify-content:center;gap:32px}.hero{min-height:205px}.cabinet-meta{margin-top:-2px}body:before{background-position:left top}}
@media(prefers-reduced-motion:reduce){.cabinet{transition:none}}

</style>
</head>
<body>
<main class="page">
<section class="game-grid" id="game-grid"></section>
</main>
<script src="./games.js"></script>
<script>
(()=>{const games=window.OURCADE_GAMES||[];document.getElementById("game-grid").innerHTML=games.map(g=>`<a class="cabinet-link" href="${esc(g.href)}" aria-label="Play ${esc(g.title)}"><article class="cabinet cabinet--${esc(g.id)}"><img class="cabinet-art" src="${esc(g.image)}" alt="${esc(g.title)} arcade cabinet" loading="lazy"></article></a>`).join("");function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}})();
</script>
</body>
</html>
