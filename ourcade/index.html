<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07020d">
<title>OURCADE — Play</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;overflow-x:hidden;background:#05030a;color:#fff;font-family:Inter,system-ui,sans-serif}
body:before{content:"";position:fixed;inset:0;z-index:-3;background:url("./ourcade-room.jpg") center top/cover no-repeat}
body:after{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(3,2,9,.03),rgba(3,2,9,.10) 55%,rgba(3,2,9,.35) 100%);pointer-events:none}
.page{width:min(1500px,100%);margin:auto;padding:16px 18px 80px}
.hero{min-height:245px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}
.logo{margin:0;font-size:clamp(54px,9vw,124px);font-weight:950;letter-spacing:.04em;line-height:.8;color:#fff;text-shadow:0 0 4px #fff,0 0 13px #ff1bd8,0 0 32px #ff1bd8,0 0 70px rgba(255,27,216,.7)}
.tagline{margin-top:22px;padding:7px 18px;border:2px solid #20c8ff;background:rgba(4,2,13,.58);font-size:clamp(11px,1.5vw,17px);font-weight:900;letter-spacing:.2em;box-shadow:0 0 8px #20c8ff,0 0 24px rgba(32,200,255,.55)}
.game-grid{width:min(1380px,100%);margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 16px;align-items:end}
.cabinet-link{display:block;color:#fff;text-decoration:none;touch-action:manipulation}
.cabinet{position:relative;transition:transform .2s ease,filter .2s ease}
.cabinet:hover{transform:translateY(-8px);filter:brightness(1.06) drop-shadow(0 18px 22px rgba(0,0,0,.75))}
.cabinet-art{width:100%;height:auto;display:block;filter:drop-shadow(0 18px 16px rgba(0,0,0,.72))}
.cabinet-meta{text-align:center;margin-top:-4px;position:relative}
.subtitle{display:block;color:rgba(255,255,255,.78);font-size:11px;letter-spacing:.12em;text-transform:uppercase;text-shadow:0 2px 6px #000}
.play{display:inline-block;margin-top:6px;padding:6px 15px;border:1px solid #20c8ff;border-radius:999px;background:rgba(4,2,12,.8);font-size:10px;font-weight:900;letter-spacing:.16em;box-shadow:0 0 10px rgba(32,200,255,.55)}
@media(max-width:900px){.page{padding:8px 12px 64px}.hero{min-height:210px}.game-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}}
@media(max-width:600px){.game-grid{grid-template-columns:minmax(0,430px);justify-content:center;gap:32px}.hero{min-height:205px}.cabinet-meta{margin-top:-2px}body:before{background-position:center top}}
@media(prefers-reduced-motion:reduce){.cabinet{transition:none}}
</style>
</head>
<body>
<main class="page">
<header class="hero"><h1 class="logo">OURCADE</h1><div class="tagline">GAME ON!</div></header>
<section class="game-grid" id="game-grid"></section>
</main>
<script src="./games.js"></script>
<script>
(()=>{const games=window.OURCADE_GAMES||[];document.getElementById("game-grid").innerHTML=games.map(g=>`<a class="cabinet-link" href="${esc(g.href)}" aria-label="Play ${esc(g.title)}"><article class="cabinet"><img class="cabinet-art" src="${esc(g.image)}" alt="${esc(g.title)} arcade cabinet" loading="lazy"><div class="cabinet-meta"><span class="subtitle">${esc(g.subtitle||"")}</span><span class="play">PLAY</span></div></article></a>`).join("");function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}})();
</script>
</body>
</html>
