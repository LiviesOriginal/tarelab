<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Napster Playlist</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; }
  body {
    overflow: hidden;
    color: #111;
    background: #c0c0c0;
    font: 11px Arial, sans-serif;
  }

  .app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    border: 2px solid;
    border-color: #fff #555 #555 #fff;
  }
  .titlebar {
    flex: 0 0 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1px 5px;
    color: white;
    background: #000080;
    font-weight: bold;
  }
  .window-buttons { color: #111; background: #c0c0c0; padding: 0 4px; }
  .menu { flex: 0 0 17px; padding: 2px 5px; border-bottom: 1px solid #888; }
  .menu span { margin-right: 12px; }

  .toolbar {
    display: flex;
    flex: 0 0 auto;
    flex-wrap: wrap;
    align-items: center;
    gap: 3px;
    padding: 3px 5px;
    border-bottom: 1px solid #888;
  }
  button, input {
    min-height: 21px;
    font: inherit;
  }
  button {
    padding: 2px 9px;
    background: #c0c0c0;
    border: 1px solid;
    border-color: #fff #555 #555 #fff;
  }
  button:active { border-color: #555 #fff #fff #555; }
  .toolbar .spacer { flex: 1; }
  #search { width: min(190px, 35vw); }

  .list-wrap {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    margin: 3px 5px 0;
    border: 1px solid;
    border-color: #555 #fff #fff #555;
    background: white;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    font-size: 10px;
  }
  th {
    position: sticky;
    top: 0;
    z-index: 1;
    height: 17px;
    padding: 1px 4px;
    text-align: left;
    font-weight: normal;
    background: #c0c0c0;
    border-bottom: 1px solid #888;
  }
  td {
    height: 15px;
    padding: 1px 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  tbody tr { cursor: pointer; }
  tbody tr:nth-child(even) { background: #f3f3f3; }
  tbody tr:hover { background: #dce8f7; }
  tbody tr.selected { color: white; background: #000080; }

  .col-name { width: auto; }
  .col-type { width: 90px; }
  .col-id { width: 115px; }

  .bottom-panels {
    flex: 0 0 145px;
    display: grid;
    grid-template-columns: minmax(230px, 32%) minmax(0, 1fr);
    gap: 5px;
    padding: 5px;
  }
  .panel {
    min-width: 0;
    display: flex;
    flex-direction: column;
    border: 1px solid;
    border-color: #fff #555 #555 #fff;
  }
  .panel-title {
    flex: 0 0 16px;
    text-align: center;
    padding: 2px;
    border-bottom: 1px solid #888;
  }
  .video-frame {
    flex: 1;
    min-height: 0;
    position: relative;
    background: #111;
  }
  #youtube-player { position: absolute; inset: 0; width: 100%; height: 100%; }

  .playlist-controls {
    display: flex;
    gap: 4px;
    padding: 3px;
  }
  .playlist-controls button { flex: 1; min-width: 0; padding: 2px 4px; }
  .queue {
    flex: 1;
    min-height: 0;
    overflow: auto;
    margin: 0 3px 3px;
    padding: 3px;
    background: white;
    border: 1px solid #888;
    white-space: pre-line;
  }
  .queue-item { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .queue-item.current { background: #000080; color: white; }

  .statusbar {
    flex: 0 0 17px;
    display: flex;
    justify-content: space-between;
    padding: 2px 5px;
    border-top: 1px solid #fff;
    font-size: 10px;
  }

  @media (max-width: 600px) {
    .toolbar { gap: 2px; }
    .toolbar button { padding: 2px 6px; }
    .toolbar .optional { display: none; }
    .list-wrap { margin-left: 3px; margin-right: 3px; }
    .col-type, .col-id { display: none; }
    .bottom-panels {
      flex-basis: 205px;
      grid-template-columns: 1fr;
      grid-template-rows: 115px minmax(70px, 1fr);
      gap: 4px;
      padding: 3px;
    }
    .panel-title { flex-basis: 14px; }
    .playlist-controls { padding: 2px; }
    .playlist-controls button { min-height: 18px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="titlebar">
    <span>Napster Playlist</span>
    <span class="window-buttons">— □ ×</span>
  </header>

  <nav class="menu">
    <span>File</span><span>Actions</span><span>Help</span>
  </nav>

  <div class="toolbar">
    <button type="button">Chat</button>
    <button type="button">Library</button>
    <button type="button">Search</button>
    <button type="button" class="optional">Hot List</button>
    <button type="button" class="optional">Transfer</button>
    <button type="button" class="optional">Help</button>
    <span class="spacer"></span>
    <label for="search">Find:</label>
    <input id="search" type="search" placeholder="Filter songs">
    <button id="reload" type="button">Refresh</button>
  </div>

  <main class="list-wrap">
    <table>
      <thead>
        <tr>
          <th class="col-name">Filename</th>
          <th class="col-type">Source</th>
          <th class="col-id">Video ID</th>
        </tr>
      </thead>
      <tbody id="tracks"></tbody>
    </table>
  </main>

  <section class="bottom-panels">
    <div class="panel">
      <div class="panel-title">Video Player</div>
      <div class="video-frame"><div id="youtube-player"></div></div>
    </div>
    <div class="panel">
      <div class="panel-title">Playlist Control Panel</div>
      <div class="playlist-controls">
        <button id="play" type="button">Play</button>
        <button id="pause" type="button">Pause</button>
        <button id="stop" type="button">Stop</button>
        <button id="refresh" type="button">Reload List</button>
      </div>
      <div class="queue" id="queue">Loading playlist…</div>
    </div>
  </section>

  <footer class="statusbar">
    <span id="status">Ready</span>
    <span id="count"></span>
  </footer>
</div>

<script>
  const PLAYLIST_URL = "/playlist.md";
  const tbody = document.querySelector("#tracks");
  const queue = document.querySelector("#queue");
  const statusEl = document.querySelector("#status");
  const countEl = document.querySelector("#count");
  const search = document.querySelector("#search");

  let tracks = [];
  let selected = -1;
  let player;
  let playerReady = false;
  let pendingId = null;

  function getVideoId(url) {
    try {
      const u = new URL(url);
      if (u.hostname === "youtu.be") return u.pathname.slice(1);
      if (u.pathname === "/watch") return u.searchParams.get("v");
      return u.pathname.match(/^\/(?:embed|shorts|live)\/([^/?]+)/)?.[1] || null;
    } catch {
      return null;
    }
  }

  function parsePlaylist(text) {
    const result = [];
    const seen = new Set();

    for (const line of text.split(/\r?\n/)) {
      const markdown = line.match(/\[([^\]]+)\]\(\s*(https?:\/\/[^)\s]+)\s*\)/);
      const urls = markdown ? [markdown[2]] : (line.match(/https?:\/\/[^\s<>)\]]+/g) || []);

      for (const raw of urls) {
        const url = raw.replace(/[.,;!?]+$/, "");
        const id = getVideoId(url);
        if (!id || seen.has(id)) continue;
        seen.add(id);
        result.push({
          id,
          url,
          title: markdown?.[1] || `YouTube video ${id}`
        });
      }
    }
    return result;
  }

  function render() {
    const q = search.value.trim().toLowerCase();
    tbody.replaceChildren();

    tracks.forEach((track, index) => {
      if (!track.title.toLowerCase().includes(q)) return;
      const row = document.createElement("tr");
      if (index === selected) row.className = "selected";

      for (const value of [track.title, "YouTube", track.id]) {
        const cell = document.createElement("td");
        cell.textContent = value;
        row.append(cell);
      }
      row.addEventListener("click", () => playTrack(index));
      tbody.append(row);
    });

    queue.replaceChildren();
    tracks.forEach((track, index) => {
      const item = document.createElement("div");
      item.className = "queue-item" + (index === selected ? " current" : "");
      item.textContent = `${index + 1}. ${track.title}`;
      item.title = track.url;
      item.addEventListener("click", () => playTrack(index));
      queue.append(item);
    });

    countEl.textContent = `${tracks.length} songs`;
  }

  async function loadPlaylist() {
    statusEl.textContent = "Loading playlist…";
    try {
      const response = await fetch(PLAYLIST_URL, { cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      tracks = parsePlaylist(await response.text());
      selected = -1;
      render();
      statusEl.textContent = tracks.length ? "Playlist loaded" : "No YouTube links found";
    } catch (error) {
      queue.textContent = "Could not load /playlist.md. Check that the file is at the site root.";
      statusEl.textContent = "Playlist load failed";
      console.error(error);
    }
  }

  function playTrack(index) {
    const track = tracks[index];
    if (!track) return;
    selected = index;
    render();
    statusEl.textContent = `Playing: ${track.title}`;

    if (playerReady) player.loadVideoById(track.id);
    else pendingId = track.id;
  }

  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player("youtube-player", {
      videoId: "",
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: () => {
          playerReady = true;
          if (pendingId) {
            player.loadVideoById(pendingId);
            pendingId = null;
          }
        },
        onStateChange: event => {
          if (event.data === YT.PlayerState.PAUSED) statusEl.textContent = "Paused";
          if (event.data === YT.PlayerState.ENDED) statusEl.textContent = "Finished";
        }
      }
    });
  };

  const ytScript = document.createElement("script");
  ytScript.src = "https://www.youtube.com/iframe_api";
  document.head.append(ytScript);

  document.querySelector("#play").onclick = () => {
    if (selected < 0 && tracks.length) playTrack(0);
    else if (playerReady) player.playVideo();
  };
  document.querySelector("#pause").onclick = () => playerReady && player.pauseVideo();
  document.querySelector("#stop").onclick = () => {
    if (playerReady) player.stopVideo();
    statusEl.textContent = "Stopped";
  };
  document.querySelector("#reload").onclick = loadPlaylist;
  document.querySelector("#refresh").onclick = loadPlaylist;
  search.addEventListener("input", render);

  loadPlaylist();
</script>
</body>
</html>
