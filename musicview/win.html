<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Napster Playlist</title>

<style>
  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
  }

  body {
    overflow: hidden;
    color: #111;
    background: #c0c0c0;
    font: 11px Arial, sans-serif;
  }

  .app {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100dvh;
    border: 2px solid;
    border-color: #fff #555 #555 #fff;
  }

  .titlebar {
    flex: 0 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1px 5px;
    color: #fff;
    background: #000080;
    font-weight: bold;
  }

  .window-buttons {
    padding: 0 4px;
    color: #111;
    background: #c0c0c0;
  }

  .menu {
    flex: 0 0 17px;
    padding: 2px 5px;
    border-bottom: 1px solid #888;
  }

  .menu span { margin-right: 12px; }

  .toolbar {
    display: flex;
    flex: 0 0 auto;
    flex-wrap: wrap;
    align-items: center;
    gap: 3px;
    padding: 3px 5px;
    border-bottom: 1px solid #888;
  }

  button, input { font: inherit; }

  button {
    min-height: 21px;
    padding: 2px 9px;
    color: #111;
    background: #c0c0c0;
    border: 1px solid;
    border-color: #fff #555 #555 #fff;
    cursor: pointer;
  }

  button:active { border-color: #555 #fff #fff #555; }

  .toolbar .spacer { flex: 1; }

  #search { width: min(190px, 35vw); }

  .list-wrap {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    margin: 3px 5px 0;
    background: #fff;
    border: 1px solid;
    border-color: #555 #fff #fff #555;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    font-size: 10px;
  }

  th {
    position: sticky;
    top: 0;
    z-index: 1;
    height: 17px;
    padding: 1px 4px;
    text-align: left;
    font-weight: normal;
    background: #c0c0c0;
    border-bottom: 1px solid #888;
  }

  td {
    height: 15px;
    padding: 1px 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  tbody tr { cursor: pointer; }
  tbody tr:nth-child(even) { background: #f3f3f3; }
  tbody tr:hover { background: #dce8f7; }
  tbody tr.selected { color: #fff; background: #000080; }

  .col-name { width: auto; }
  .col-source { width: 90px; }
  .col-id { width: 115px; }

  .bottom-panels {
    flex: 0 0 min(230px, 35dvh);
    display: grid;
    grid-template-columns: minmax(0, 7fr) minmax(200px, 3fr);
    gap: 5px;
    padding: 5px;
  }

  .panel {
    display: flex;
    flex-direction: column;
    min-width: 0;
    border: 1px solid;
    border-color: #fff #555 #555 #fff;
  }

  .panel-title {
    flex: 0 0 16px;
    padding: 2px;
    text-align: center;
    border-bottom: 1px solid #888;
  }

  .video-frame {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    background: #111;
  }

  #youtube-player {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .video-launch {
    position: absolute;
    inset: 0;
    z-index: 2;
    width: 100%;
    height: 100%;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
  }

  .video-launch span {
    position: absolute;
    right: 8px;
    bottom: 8px;
    padding: 5px 9px;
    color: #fff;
    background: rgba(0, 0, 0, .75);
    border: 1px solid #aaa;
  }

  .playlist-controls {
    display: flex;
    gap: 4px;
    padding: 3px;
  }

  .playlist-controls button {
    flex: 1;
    min-width: 0;
    padding: 2px 4px;
  }

  .queue {
    flex: 1;
    min-height: 0;
    overflow: auto;
    margin: 0 3px 3px;
    padding: 3px;
    white-space: pre-line;
    background: #fff;
    border: 1px solid #888;
  }

  .queue-item {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: pointer;
  }

  .queue-item.current {
    color: #fff;
    background: #000080;
  }

  .statusbar {
    flex: 0 0 17px;
    display: flex;
    justify-content: space-between;
    padding: 2px 5px;
    border-top: 1px solid #fff;
    font-size: 10px;
  }

  .video-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 4vw;
    background: rgba(0, 0, 0, .88);
  }

  .video-overlay.open { display: flex; }

  .overlay-content {
    position: relative;
    width: min(1100px, 94vw);
    aspect-ratio: 16 / 9;
    background: #000;
    border: 2px solid #aaa;
  }

  .overlay-content iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }

  .overlay-close {
    position: absolute;
    top: -36px;
    right: 0;
    min-width: 32px;
    color: #fff;
    background: #333;
    border: 1px solid #aaa;
    font-size: 18px;
  }

  @media (max-width: 600px) {
    .toolbar { gap: 2px; }
    .toolbar button { padding: 2px 6px; }
    .toolbar .optional { display: none; }

    .list-wrap {
      margin-right: 3px;
      margin-left: 3px;
    }

    /* Keep mobile rows compact by hiding secondary columns. */
    .col-source,
    .col-id {
      display: none;
    }

    .bottom-panels {
      flex-basis: min(250px, 40dvh);
      grid-template-columns: 1fr;
      grid-template-rows: minmax(100px, 3fr) minmax(65px, 2fr);
      gap: 4px;
      padding: 3px;
    }

    .panel-title { flex-basis: 14px; }
    .playlist-controls { padding: 2px; }
    .playlist-controls button {
      min-height: 18px;
      padding: 2px 4px;
    }
  }
</style>
</head>

<body>
<div class="app">
  <header class="titlebar">
    <span>Napster Playlist</span>
    <span class="window-buttons">— □ ×</span>
  </header>

  <nav class="menu" aria-label="Menu">
    <span>File</span>
    <span>Actions</span>
    <span>Help</span>
  </nav>

  <div class="toolbar">
    <button type="button">Chat</button>
    <button type="button">Library</button>
    <button type="button">Search</button>
    <button type="button" class="optional">Hot List</button>
    <button type="button" class="optional">Transfer</button>
    <button type="button" class="optional">Help</button>

    <span class="spacer"></span>

    <label for="search">Find:</label>
    <input id="search" type="search" placeholder="Filter songs">
    <button id="refresh" type="button">Refresh</button>
  </div>

  <main class="list-wrap">
    <table>
      <thead>
        <tr>
          <th class="col-name">Filename</th>
          <th class="col-source">Source</th>
          <th class="col-id">Video ID</th>
        </tr>
      </thead>
      <tbody id="tracks"></tbody>
    </table>
  </main>

  <section class="bottom-panels">
    <div class="panel">
      <div class="panel-title">Video Player — click to enlarge</div>
      <div class="video-frame">
        <div id="youtube-player"></div>
        <button
          class="video-launch"
          id="open-video"
          type="button"
          aria-label="Open video in large player">
          <span>Open video larger</span>
        </button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Playlist Control Panel</div>
      <div class="playlist-controls">
        <button id="play" type="button">Play</button>
        <button id="pause" type="button">Pause</button>
        <button id="stop" type="button">Stop</button>
      </div>
      <div class="queue" id="queue">Loading playlist…</div>
    </div>
  </section>

  <footer class="statusbar">
    <span id="status">Ready</span>
    <span id="count"></span>
  </footer>
</div>

<div
  class="video-overlay"
  id="video-overlay"
  role="dialog"
  aria-modal="true"
  aria-label="Video player">
  <div class="overlay-content">
    <button
      class="overlay-close"
      id="close-video"
      type="button"
      aria-label="Close video">×</button>
    <iframe
      id="overlay-player"
      title="YouTube video"
      allow="autoplay; encrypted-media; picture-in-picture"
      allowfullscreen></iframe>
  </div>
</div>

<script>
  const PLAYLIST_URL = "/playlist.md";

  const tbody = document.querySelector("#tracks");
  const queue = document.querySelector("#queue");
  const statusEl = document.querySelector("#status");
  const countEl = document.querySelector("#count");
  const search = document.querySelector("#search");
  const overlay = document.querySelector("#video-overlay");
  const overlayPlayer = document.querySelector("#overlay-player");

  let tracks = [];
  let selected = -1;
  let player;
  let playerReady = false;
  let pendingId = null;

  function getVideoId(url) {
    try {
      const parsed = new URL(url);

      if (parsed.hostname === "youtu.be") {
        return parsed.pathname.slice(1);
      }

      if (parsed.pathname === "/watch") {
        return parsed.searchParams.get("v");
      }

      const match = parsed.pathname.match(
        /^\/(?:embed|shorts|live)\/([^/?]+)/
      );

      return match ? match[1] : null;
    } catch {
      return null;
    }
  }

  function parsePlaylist(text) {
    const result = [];
    const seen = new Set();

    for (const line of text.split(/\r?\n/)) {
      const markdownLink = line.match(
        /\[([^\]]+)\]\(\s*(https?:\/\/[^)\s]+)\s*\)/
      );

      const urls = markdownLink
        ? [markdownLink[2]]
        : (line.match(/https?:\/\/[^\s<>)\]]+/g) || []);

      for (const rawUrl of urls) {
        const url = rawUrl.replace(/[.,;!?]+$/, "");
        const id = getVideoId(url);

        if (!id || seen.has(id)) continue;
        seen.add(id);

        result.push({
          id,
          url,
          title: markdownLink?.[1] || `YouTube video ${id}`
        });
      }
    }

    return result;
  }

  function render() {
    const query = search.value.trim().toLowerCase();
    tbody.replaceChildren();

    tracks.forEach((track, index) => {
      if (!track.title.toLowerCase().includes(query)) return;

      const row = document.createElement("tr");
      if (index === selected) row.className = "selected";

      for (const value of [track.title, "YouTube", track.id]) {
        const cell = document.createElement("td");
        cell.textContent = value;
        row.append(cell);
      }

      row.addEventListener("click", () => playTrack(index));
      tbody.append(row);
    });

    queue.replaceChildren();

    tracks.forEach((track, index) => {
      const item = document.createElement("div");
      item.className = "queue-item" + (index === selected ? " current" : "");
      item.textContent = `${index + 1}. ${track.title}`;
      item.title = track.url;
      item.addEventListener("click", () => playTrack(index));
      queue.append(item);
    });

    countEl.textContent =
      `${tracks.length} song${tracks.length === 1 ? "" : "s"}`;
  }

  async function loadPlaylist() {
    statusEl.textContent = "Loading playlist…";

    try {
      const response = await fetch(PLAYLIST_URL, { cache: "no-store" });

      if (!response.ok) {
        throw new Error(`Playlist request failed: ${response.status}`);
      }

      tracks = parsePlaylist(await response.text());
      selected = -1;
      render();
      statusEl.textContent = tracks.length
        ? "Playlist loaded"
        : "No YouTube links found";
    } catch (error) {
      queue.textContent =
        "Could not load /playlist.md. Check that the file is at the site root.";
      statusEl.textContent = "Playlist load failed";
      console.error(error);
    }
  }

  function playTrack(index) {
    const track = tracks[index];
    if (!track) return;

    selected = index;
    render();
    statusEl.textContent = `Playing: ${track.title}`;

    if (playerReady) {
      player.loadVideoById(track.id);
    } else {
      pendingId = track.id;
    }
  }

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player("youtube-player", {
      videoId: "",
      playerVars: {
        playsinline: 1,
        rel: 0
      },
      events: {
        onReady: function () {
          playerReady = true;

          if (pendingId) {
            player.loadVideoById(pendingId);
            pendingId = null;
          }
        },
        onStateChange: function (event) {
          if (event.data === YT.PlayerState.PAUSED) {
            statusEl.textContent = "Paused";
          }
          if (event.data === YT.PlayerState.ENDED) {
            statusEl.textContent = "Finished";
          }
        }
      }
    });
  };

  const youtubeScript = document.createElement("script");
  youtubeScript.src = "https://www.youtube.com/iframe_api";
  document.head.append(youtubeScript);

  document.querySelector("#play").addEventListener("click", () => {
    if (selected < 0 && tracks.length) {
      playTrack(0);
    } else if (playerReady) {
      player.playVideo();
    }
  });

  document.querySelector("#pause").addEventListener("click", () => {
    if (playerReady) player.pauseVideo();
  });

  document.querySelector("#stop").addEventListener("click", () => {
    if (playerReady) player.stopVideo();
    statusEl.textContent = "Stopped";
  });

  document.querySelector("#refresh").addEventListener("click", loadPlaylist);
  search.addEventListener("input", render);

  document.querySelector("#open-video").addEventListener("click", () => {
    const track = tracks[selected];
    if (!track) return;

    overlayPlayer.src =
      `https://www.youtube.com/embed/${encodeURIComponent(track.id)}` +
      "?autoplay=1&playsinline=1";
    overlay.classList.add("open");
  });

  function closeOverlay() {
    overlay.classList.remove("open");
    overlayPlayer.src = "";
  }

  document.querySelector("#close-video").addEventListener(
    "click",
    closeOverlay
  );

  overlay.addEventListener("click", event => {
    if (event.target === overlay) closeOverlay();
  });

  document.addEventListener("keydown", event => {
    if (event.key === "Escape") closeOverlay();
  });

  loadPlaylist();
</script>
</body>
</html>
