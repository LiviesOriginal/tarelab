<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3366"/>
      <stop offset="1" stop-color="#12152b"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6d5"/>
      <stop offset="1" stop-color="#f2d98a"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="32" height="32" fill="black"/>
      <circle cx="17" cy="16.5" r="9" fill="white"/>
      <circle cx="21.2" cy="13" r="8" fill="black"/>
    </mask>
  </defs>

  <!-- night sky tile -->
  <rect width="32" height="32" rx="7" fill="url(#sky)"/>

  <!-- crescent moon -->
  <rect width="32" height="32" fill="url(#moon)" mask="url(#crescent)"/>

  <!-- stars -->
  <circle cx="8.5" cy="9" r="1.05" fill="#fff6d5"/>
  <circle cx="23.5" cy="24" r="0.8" fill="#fdeeb8"/>
  <circle cx="12" cy="24.5" r="0.55" fill="#e9edff" opacity="0.85"/>
</svg>
