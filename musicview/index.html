<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="A retro-room YouTube player driven by Markdown playlists." />
    <title>Retro Room TV</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="theme-color" content="#050505" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3PM570SXPX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-3PM570SXPX');
    </script>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <img id="room" class="room" alt="Retro living room with a television, bookcase, chair, and media console" />

      <main id="tv" class="tv" aria-label="Television">
        <section id="screen" class="screen" aria-label="YouTube player">
          <div class="screen-blackout" aria-hidden="true"></div>
          <div id="player" class="player"></div>

          <button id="playlist-toggle" class="playlist-toggle" type="button" aria-expanded="false" aria-controls="playlist-panel" title="Show playlist">
            <span aria-hidden="true">☰</span>
            <span class="sr-only">Show playlist</span>
          </button>

          <aside id="playlist-panel" class="playlist-panel" aria-label="Playlist">
            <div class="playlist-heading">
              <div class="playlist-heading-main">
                <select id="playlist-select" class="playlist-select" aria-label="Choose playlist"></select>
              </div>
              <span id="playlist-count"></span>
            </div>

            <div class="now-playing" aria-live="polite">
              <span class="now-playing-label">Now playing</span>
              <strong id="now-playing-title">Nothing playing</strong>
            </div>

            <div class="playlist-controls" aria-label="Playback controls">
              <button id="playlist-previous" type="button" class="playlist-control" title="Previous video">‹</button>
              <button id="playlist-next" type="button" class="playlist-control playlist-control-primary" title="Next video">›</button>
            </div>

            <div id="playlist-items" class="playlist-items"></div>

            <section class="queue-section" aria-label="Queue">
              <div class="queue-heading">
                <strong>Queue</strong>
                <span id="queue-count"></span>
                <button id="queue-clear" type="button" class="queue-clear">Clear</button>
              </div>
              <div id="queue-items" class="queue-items"></div>
            </section>
          </aside>
        </section>
      </main>

      <div id="status" class="status" role="status" aria-live="polite"></div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
