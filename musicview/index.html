<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171126" />
    <title>Retro Music TV</title>
  </head>
  <body>
    <main class="page">
      <div class="brand">RETRO MUSIC TV</div>
      <section class="tv">
        <div class="screen-shell">
          <div class="screen">
            <iframe id="player" src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=0&rel=0" title="Retro music video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
            <div class="live-badge">ON AIR</div>
            <div class="now-playing" id="nowPlaying">Now playing: Retro Music Channel</div>
          </div>
        </div>
        <div class="tv-controls">
          <div class="control-knob"></div>
          <div class="speaker">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="control-knob"></div>
        </div>
      </section>
      <section class="playlist-section">
        <div class="playlist-heading">
          <h2>Now Playing Queue</h2>
          <button id="refreshPlaylist" type="button">Refresh Playlist</button>
        </div>
        <div id="playlist" class="playlist">Loading playlist…</div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
