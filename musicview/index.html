<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#160f0a" />
    <meta name="description" content="Retro Music TV — a CRT living-room music video player." />
    <title>Retro Music TV</title>
  </head>
  <body>
    <main class="app">
      <section class="scene" aria-label="Retro living-room television">
        <div class="tv-player" id="tvPlayer">
          <div class="player-screen">
            <iframe
              id="player"
              src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=0&rel=0&modestbranding=1"
              title="Retro Music TV YouTube player"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen
            ></iframe>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
