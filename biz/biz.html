<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Short List</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 4px;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      min-height: 285px;
      padding: 11px 12px 24px;
      border: 1px solid #e7e9ec;
      display: grid;
      grid-template-columns: 142px minmax(0, 1fr);
      gap: 14px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      font-weight: 400;
    }

    .entries {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px 15px;
      align-content: start;
    }

    .entry { min-width: 0; }

    .entry .preview-link,
    .entry .preview-link img {
      display: block;
      width: 100%;
    }

    .entry .preview-link img {
      aspect-ratio: 1 / 1.1;
      object-fit: cover;
    }

    .entry hr {
      border: 0;
      border-top: 1px solid #bfc2c4;
      margin: 4px 0 8px;
    }

    .entry h2 {
      margin: 0 0 3px;
      font-size: 9px;
      line-height: 1.15;
      font-weight: 700;
    }

    .entry p {
      margin: 0;
      font-size: 7px;
      line-height: 1.35;
    }

    @media (max-width: 600px) {
      .page {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .entries { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Short List</h1>
    <section class="entries" id="entries" aria-label="Business listings"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    fetch("./biz.md")
      .then(response => {
        if (!response.ok) throw new Error("Could not load biz.md");
        return response.text();
      })
      .then(markdown => {
        const entries = document.getElementById("entries");
        const sections = markdown
          .split(/^---\s*$/m)
          .map(section => section.trim())
          .filter(Boolean);

        for (const section of sections) {
          const article = document.createElement("article");
          article.className = "entry";
          article.innerHTML = marked.parse(section);

          const imageLink = article.querySelector("p a img")?.parentElement;
          if (imageLink) imageLink.classList.add("preview-link");

          const title = article.querySelector("p strong");
          if (title) {
            const titleParagraph = title.closest("p");
            const heading = document.createElement("h2");
            heading.innerHTML = title.innerHTML;
            titleParagraph.replaceWith(heading);
          }

          const imageParagraph = article.querySelector("p:has(.preview-link)");
          if (imageParagraph) {
            const rule = document.createElement("hr");
            imageParagraph.after(rule);
          }

          entries.appendChild(article);
        }
      })
      .catch(error => {
        document.getElementById("entries").textContent =
          "Listings could not be loaded. Make sure biz.md is beside index.html and serve the files from a web server.";
        console.error(error);
      });
  </script>
</body>
</html>
