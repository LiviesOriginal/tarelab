<style>
:root{--bg:#fbfaf7;--season-bg:#7956a8;--ink:#1e1d1b;--muted:#8a857d;--rule:#e8e4dc;--link:#3b3f8f;--code-bg:#f1efe9;--star:#c9a227;--grid:#d7d0c4;--measure:760px}
*{box-sizing:border-box}html,body{margin:0}html{scroll-behavior:smooth}body{background:var(--bg);color:var(--ink);font-family:"Newsreader",Georgia,serif;font-size:19px;line-height:1.7;padding:0 20px;overflow-x:hidden}.wrap{max-width:var(--measure);margin:0 auto;padding:32px 0 48px}.masthead{margin-bottom:22px}.masthead h1{font-family:"Fraunces",serif;font-weight:600;font-size:clamp(30px,6vw,44px);letter-spacing:-.02em;line-height:1.05;margin:0}.masthead p{margin:10px 0 0;color:var(--muted);font-style:italic;font-size:1.05rem}.masthead .rule{height:1px;background:var(--rule);border:0;margin:18px 0 0}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 26px}.nav a{display:inline-block;padding:7px 13px;border:1px solid #6a4b91;border-radius:999px;background:var(--season-bg);color:#fff;font-family:"Fraunces",serif;font-size:.78rem;font-weight:600;text-decoration:none;box-shadow:0 2px 4px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.22);transition:background-color .6s ease,box-shadow .6s ease}.nav a:hover{background:#68468f;box-shadow:0 3px 7px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.2)}h2.section{font-family:"Fraunces",serif;font-weight:600;font-size:1.5rem;letter-spacing:-.01em;margin:28px 0 10px;scroll-margin-top:18px}h2.section:first-of-type{margin-top:8px}table{width:100%;border-collapse:collapse;margin:0;border:1px solid var(--grid);table-layout:fixed}thead th{text-align:left;font-family:"Fraunces",serif;font-weight:600;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:#faf9f6;padding:6px 10px;border:1px solid var(--grid)}.read thead th:nth-child(3),.read thead th:nth-child(4){text-align:right}.read .book-row td{padding:9px 10px 4px;vertical-align:baseline;border:1px solid var(--grid);border-bottom:0;overflow-wrap:anywhere}.read .book-row .t{font-family:"Fraunces",serif;font-weight:500;font-size:1.12rem;line-height:1.2}.read .book-row .a{color:var(--muted);overflow-wrap:anywhere}.read .book-row .s{text-align:right;white-space:nowrap}.read .detail-row td{padding:4px 10px 12px;border:1px solid var(--grid);border-top:0;overflow-wrap:anywhere}.review{margin:.15em 0 .55em}.lines{list-style:none;margin:0;padding:0}.lines li{border-left:0;border-top:1px solid var(--rule);padding:10px 0 0;color:var(--muted);font-style:italic;margin:10px 0 0;overflow-wrap:anywhere;line-height:1.45}.lines li:first-child{border-top:0;padding-top:0;margin-top:0}.stars .on{color:var(--star)}.stars .off{color:var(--rule)}.toread td{padding:12px;border:1px solid var(--grid);overflow-wrap:anywhere}.toread .t{font-family:"Fraunces",serif;font-weight:500}.toread .a,.toread .p{color:var(--muted)}.review a{color:var(--link);text-decoration:underline;text-underline-offset:2px}.review code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85em;background:var(--code-bg);padding:.1em .35em;border-radius:4px}.state{color:var(--muted);font-style:italic}.section-end{margin:12px 0 34px;text-align:right}.section-end a{color:var(--muted);font-size:.82rem;text-decoration:none}.section-end a:hover{text-decoration:underline}.foot{display:none}.cover-wrap{display:flex;align-items:center;gap:11px;min-width:0}.cover-link{display:block;line-height:0;flex:0 0 auto}.cover{width:34px;height:51px;object-fit:cover;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.28);background:var(--code-bg);flex:0 0 auto}.cover-ph{width:34px;height:51px;display:flex;align-items:center;justify-content:center;border-radius:3px;background:var(--code-bg);border:1px solid var(--grid);color:var(--muted);font-family:"Fraunces",serif;font-size:9px;line-height:1;text-align:center;flex:0 0 34px}.t .book-link{color:inherit;text-decoration:none;overflow-wrap:anywhere}.t .book-link:hover{text-decoration:underline;text-underline-offset:2px}.rating-label{display:none}
@media(max-width:520px){body{font-size:18px;background:linear-gradient(145deg,#5c3d82 0%,#7956a8 45%,#9b72c2 72%,#4d326f 100%);padding:12px 10px;min-height:100vh;height:100vh;overflow:hidden}.wrap{width:100%;max-width:760px;height:calc(100vh - 24px);margin:0 auto;padding:18px 16px 20px;background:#fff;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);overflow:hidden;display:flex;flex-direction:column}.masthead{margin-bottom:10px;flex:0 0 auto;display:flex;align-items:baseline;gap:9px}.masthead h1{font-size:clamp(30px,9vw,40px);white-space:nowrap}.masthead p{margin:0;color:var(--muted);font-style:italic;font-size:.9rem;white-space:nowrap}.masthead .rule{display:none}.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:14px;flex:0 0 auto}.nav a{text-align:center;padding:6px 4px;font-size:.72rem;white-space:nowrap;background:var(--season-bg);border:1px solid #6a4b91;color:#fff;box-shadow:0 2px 0 rgba(40,32,24,.2),0 4px 9px rgba(40,32,24,.14);border-radius:9px;transition:background-color .6s ease,box-shadow .6s ease}.nav a:hover{background:#68468f;box-shadow:0 3px 0 rgba(40,32,24,.2),0 6px 12px rgba(40,32,24,.16)}#shelf{min-height:0;flex:1 1 auto;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding-right:2px}h2.section{font-size:1.3rem;margin:22px 0 10px;scroll-margin-top:12px}.toread{display:block;border:0;width:100%;table-layout:auto}.toread thead{display:none}.toread tbody{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}.toread tr{display:block;min-width:0;overflow:hidden;background:#fff;border:1px solid var(--grid);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:7px}.toread td{display:block;width:100%;min-width:0;border:0!important;padding:0!important;overflow-wrap:anywhere}.toread td.t .cover-wrap{display:block;width:100%;min-width:0}.toread td.t .cover{display:block;width:92%;margin:0 auto;height:auto;aspect-ratio:2/3;object-fit:cover;border-radius:7px;box-shadow:none}.toread td.t .book-title{display:block;margin-top:7px;font-family:"Fraunces",serif;font-size:12px;font-weight:700;line-height:1.18;overflow-wrap:anywhere}.toread td.a{margin-top:3px;font-size:12px;font-weight:400;line-height:1.2;color:var(--muted);overflow-wrap:anywhere}.toread td.p{margin-top:5px;font-size:11px;line-height:1.2;color:var(--muted)}.section-end{margin:10px 0 28px;text-align:right}.section-end a{font-size:.78rem}.read{display:block;border:0;width:100%;table-layout:auto}.read thead{display:none}.read tbody{display:block;width:100%}.read .book-row{display:block;width:100%;margin:0;background:#fff;border:1px solid var(--grid);border-bottom:0!important;border-radius:16px 16px 0 0;overflow:hidden}.read .book-row td{display:block;width:100%;min-width:0;border:0!important;padding:0!important;overflow-wrap:anywhere}.read .book-row td.t .cover-wrap{display:block;width:100%;min-width:0;padding:14px}.read .book-row td.t .cover{display:block;width:82%;height:auto;aspect-ratio:2/3;object-fit:cover;border-radius:8px;box-shadow:none;margin:0 auto}.read .book-row td.t .book-title{display:block;padding:0 14px;text-align:center;font-family:"Fraunces",serif;font-size:1.12rem;font-weight:500;line-height:1.2;overflow-wrap:anywhere}.read .book-row td.a{padding:5px 14px 0!important;color:var(--muted);font-size:1rem;line-height:1.25;text-align:center}.read .book-row td.s{display:inline-flex;align-items:center;gap:5px;width:50%;padding:12px 14px 14px!important;text-align:left;white-space:nowrap;font-size:.95rem;vertical-align:top}.read .book-row td.s:nth-child(3){justify-content:flex-start;text-align:left}.read .book-row td.s:nth-child(4){justify-content:flex-end;text-align:right}.read .book-row td.s .rating-label{display:inline;font-family:"Fraunces",serif;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.read .detail-row{display:block;width:100%;margin:0 0 22px;background:#fff;border:1px solid var(--grid)!important;border-top:0!important;border-radius:0 0 16px 16px;overflow:hidden}.read .detail-row td{display:block;width:100%;padding:0 14px 16px!important;border:0!important;overflow-wrap:anywhere}.review{margin:0 0 .7em;line-height:1.55}.lines li{border-left:0;border-top:1px solid var(--rule);padding:10px 0 0;color:var(--muted);font-style:italic;margin:10px 0 0;overflow-wrap:anywhere;line-height:1.45}.lines li:first-child{border-top:0;padding-top:0;margin-top:0}.cover-ph{width:100%;height:auto;aspect-ratio:2/3;flex-basis:auto;font-size:13px;border:0;border-radius:0}.foot{display:none}}
</style></head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-3PM570SXPX"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){return dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-3PM570SXPX')</script>
<body><div class="wrap"><header class="masthead" id="top"><h1>Book Club</h1><p>Reading &amp; Read</p><hr class="rule"/></header><nav class="nav" aria-label="Book Club sections"><a href="#general">General</a><a href="#sapphic">Sapphic</a><a href="#classic">Classic</a><a href="#read">Read</a></nav><main id="shelf"><p class="state">Loading the shelf…</p></main><footer class="foot"></footer></div>
<script>
(()=>{const shelf=document.getElementById('shelf'),READERS=['RGF','LAB'];const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
function coverImg(isbn){if(!isbn)return '<img class="cover" src="https://dryofg8nmyqjw.cloudfront.net/images/no-cover.png" alt="No cover available" loading="lazy">';const clean=isbn.replace(/[^0-9Xx]/g,'');const url='https://covers.openlibrary.org/b/isbn/'+encodeURIComponent(clean)+'-M.jpg?default=false';return '<img class="cover" src="'+url+'" alt="" loading="lazy" onerror="this.onerror=null;this.src=\'https://dryofg8nmyqjw.cloudfront.net/images/no-cover.png\';this.alt=\'No cover available\'">'}
function bookLink(title,author,isbn){const q=encodeURIComponent((isbn||'').replace(/[^0-9Xx]/g,''));return '<a class="book-link" href="https://www.goodreads.com/search?q='+q+'" target="_blank" rel="noopener">'+esc(title)+'</a>'}
function coverLink(isbn){const q=encodeURIComponent((isbn||'').replace(/[^0-9Xx]/g,''));return '<a class="cover-link" href="https://www.goodreads.com/search?q='+q+'" target="_blank" rel="noopener">'+coverImg(isbn)+'</a>'}
function stars(v){const t=(v==null)?'':String(v).trim();if(t===''||t==='0')return '<span class="stars off" aria-label="not yet rated">—</span>';let n=parseInt(t,10);if(isNaN(n))n=0;n=Math.max(0,Math.min(5,n));let out='';for(let i=1;i<=5;i++)out+='<span class="'+(i<=n?'on':'off')+'">★</span>';return '<span class="stars" aria-label="'+n+' out of 5 stars">'+out+'</span>'}
function parse(text){const lines=text.replace(/\r\n/g,'\n').split('\n'),blocks=[];let mode=null,curBook=null,curRead=null,curList=null;const flushBook=()=>{if(curBook&&curRead){curBook.review=curBook.reviewLines.join(' ').trim();curRead.books.push(curBook);curBook=null}};for(const raw of lines){const line=raw.replace(/\s+$/,'');const sec=line.match(/^#\s+(.*)/);if(sec){flushBook();const heading=sec[1].trim();if(heading.toLowerCase()==='read'){curRead={type:'read',books:[]};blocks.push(curRead);mode='read';curList=null}else{curList={type:'list',title:heading,items:[]};blocks.push(curList);mode='toread';curRead=null}continue}if(mode==='read'){const bk=line.match(/^##\s+(.*)/);if(bk){flushBook();const p=bk[1].split('|').map(s=>s.trim());curBook={title:p[0]||'',author:p[1]||'',stars:[p[2]||'',p[3]||''],isbn:p[4]||'',reviewLines:[],lines:[]};continue}if(!curBook)continue;const fav=line.match(/^\s*-\s+(.*)/);if(fav){curBook.lines.push(fav[1].trim());continue}if(line.trim()==='')continue;curBook.reviewLines.push(line.trim())}else if(mode==='toread'){if(line.trim()===''||!curList)continue;const p=line.split('|').map(s=>s.trim());curList.items.push({title:p[0]||'',author:p[1]||'',isbn:p[2]||''})}}flushBook();return blocks}
async function loadPages(blocks){const targets=blocks.filter(b=>b.type==='list'&&/^To read - (General|Sapphic|Classic)$/i.test(b.title));const books=targets.flatMap(b=>b.items).filter(b=>/^97\d{11}$/.test((b.isbn||'').replace(/[^0-9]/g,'')));if(!books.length)return;const unique=[...new Set(books.map(b=>b.isbn.replace(/[^0-9]/g,'')))];for(let i=0;i<unique.length;i+=20){const ids=unique.slice(i,i+20);try{const r=await fetch('https://openlibrary.org/api/books?bibkeys='+encodeURIComponent(ids.map(id=>'ISBN:'+id).join(','))+'&jscmd=data&format=json');if(!r.ok)continue;const data=await r.json();const missing=[];ids.forEach(id=>{const pages=data['ISBN:'+id]?.number_of_pages;if(pages){document.querySelectorAll('[data-pages-isbn="'+id+'"]').forEach(el=>{el.textContent=pages+' pp'})}else missing.push(id)});for(const id of missing){try{const gr=await fetch('https://www.googleapis.com/books/v1/volumes?q=isbn:'+encodeURIComponent(id));if(!gr.ok)continue;const gd=await gr.json();const pageCount=gd?.items?.[0]?.volumeInfo?.pageCount;if(pageCount)document.querySelectorAll('[data-pages-isbn="'+id+'"]').forEach(el=>{el.textContent=pageCount+' pp'})}catch(_){} }}catch(_){} }}
function listId(title){const m=title.match(/^To read - (General|Sapphic|Classic)$/i);return m?m[1].toLowerCase():''}function sectionEnd(){return '<div class="section-end"><a href="#top" class="return-top">Return to top ↑</a></div>'}
function render(blocks){const hasContent=blocks.some(b=>(b.type==='read'&&b.books.length)||(b.type==='list'&&b.items.length));if(!hasContent){shelf.innerHTML='<p class="state">No books yet — add some in books.md.</p>';return}const pageLists=/^To read - (General|Sapphic|Classic)$/i;const listTable=list=>{if(!list.items.length)return '';const showPages=pageLists.test(list.title);const id=listId(list.title);let s='<section id="'+id+'"><h2 class="section">'+esc(list.title)+(id==='general'?'<span class="general-status" style="color:var(--muted);font-family:inherit;font-size:50%;font-weight:400;margin-left:.5em">(** 1/2 already read)</span>':'')+'</h2><table class="toread"><thead><tr><th>Title</th><th>Author</th>'+(showPages?'<th>Pages</th>':'')+'</tr></thead><tbody>';list.items.forEach(b=>{const isbn=(b.isbn||'').replace(/[^0-9]/g,'');s+='<tr><td class="t"><span class="cover-wrap">'+coverLink(b.isbn)+ '<span class="book-title">'+esc(b.title)+'</span></span></td><td class="a">'+esc(b.author)+'</td>'+(showPages?'<td class="p" data-pages-isbn="'+esc(isbn)+'"></td>':'')+'</tr>'});s+='</tbody></table>'+sectionEnd()+'</section>';return s};const readTable=books=>{if(!books.length)return '';let s='<section id="read"><h2 class="section">Read</h2><table class="read"><thead><tr><th>Book</th><th>Author</th><th>'+esc(READERS[0])+'</th><th>'+esc(READERS[1])+'</th></tr></thead><tbody>';books.forEach(b=>{s+='<tr class="book-row"><td class="t"><span class="cover-wrap">'+coverLink(b.isbn)+'<span class="book-title">'+esc(b.title)+'</span></span></td><td class="a">'+esc(b.author)+'</td><td class="s"><span class="rating-label">'+esc(READERS[0])+'</span>'+stars(b.stars[0])+'</td><td class="s"><span class="rating-label">'+esc(READERS[1])+'</span>'+stars(b.stars[1])+'</td></tr>';if(b.review||b.lines.length){s+='<tr class="detail-row"><td colspan="4">';if(b.review)s+='<p class="review">'+inline(b.review)+'</p>';if(b.lines.length)s+='<ul class="lines">'+b.lines.map(l=>'<li>'+esc(l)+'</li>').join('')+'</ul>';s+='</td></tr>'}});s+='</tbody></table>'+sectionEnd()+'</section>';return s};let h='';const lists=blocks.filter(b=>b.type==='list');const read=blocks.find(b=>b.type==='read');lists.forEach(b=>{h+=listTable(b)});if(read)h+=readTable(read.books);shelf.innerHTML=h;loadPages(blocks);document.querySelectorAll('.return-top').forEach(link=>link.addEventListener('click',e=>{e.preventDefault();shelf.scrollTo({top:0,behavior:'smooth'})}))}
fetch('books.md?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(t=>render(parse(t))).catch(err=>{shelf.innerHTML='<p class="state">Couldn’t load <b>books.md</b> ('+esc(err.message)+').<br>If you opened this file straight from your computer, browsers block that — view it on your live site. Make sure books.md sits in the same folder as this page.</p>'})})();
</script></body></html>
