<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Book Club</title>
<!-- Google tag (gtag.js) -->

    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }

  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Fauna+One&display=swap" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{
  --ink:#2a1b1d;
  --muted:#806f70;
  --paper:#fffaf2;

  --plum:#4a183d;
  --plum-2:#6b234f;

  --cranberry:#9e3047;
  --cranberry-dark:#7f2338;

  --pumpkin:#d96b27;
  --pumpkin-dark:#b9511d;

  --mustard:#d7a928;

  --cream:#fff4df;

  --rule:#e3d4c8;
  --grid:#d8c5b9;
  --star:#c58a19;
  --link:#7f2338;
  --code-bg:#f2e7dc;

  --measure:1180px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0}
body{
  background:
  radial-gradient(circle at 12% 10%,rgba(255,255,255,.10),transparent 28%),
  linear-gradient(145deg,#321329 0%,#5a183d 48%,#8a3040 100%);
  color:var(--ink);
  font-family:"Fauna One",Georgia,serif;
  font-size:18px;
  line-height:1.65;
  min-height:100vh;
  padding:28px;
  overflow-x:hidden;
}
.wrap{
  width:min(var(--measure),100%);
  min-height:calc(100vh - 56px);
  margin:0 auto;
  padding:34px 42px 48px;
  background:var(--paper);
  border-radius:28px;
  box-shadow:0 24px 70px rgba(30,5,25,.28);
  overflow:hidden;
}
.masthead{margin-bottom:22px}
.masthead h1{
  display:inline-block;
  margin:0;
  color:var(--plum);
  font-family:"Quicksand",sans-serif;
  font-weight:700;
  font-size:clamp(34px,5vw,58px);
  letter-spacing:-.045em;
  line-height:.95;
}
.masthead p{
  display:inline-block;
  margin:0 0 0 14px;
  color:var(--plum-2);
  font-size:1rem;
  font-style:italic;
}
.masthead .rule{
  height:8px;
  margin:18px 0 0;
  border:0;
  border-radius:999px;
  background:linear-gradient(90deg,var(--plum),var(--coral),var(--yellow),transparent);
}
.nav{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin:0 0 28px;
}
.nav a{
  display:inline-block;
  padding:8px 17px;
  border:2px solid var(--plum);
  border-radius:999px;
  background:var(--plum);
  color:#fff;
  font-family:"Quicksand",sans-serif;
  font-size:.78rem;
  font-weight:700;
  text-decoration:none;
  transition:transform .18s ease,background .18s ease,color .18s ease;
}

.nav a:nth-child(2){
  background:var(--cranberry);
  color:#fff;
  border-color:var(--cranberry);
}

.nav a:nth-child(3){
  background:var(--pumpkin);
  color:#fff;
  border-color:var(--pumpkin);
}

.nav a:nth-child(4){
  background:var(--mustard);
  color:var(--ink);
  border-color:var(--mustard);
}
.nav a:hover{transform:translateY(-2px);background:#fff;color:var(--plum);box-shadow:0 5px 12px rgba(77,18,63,.12)}

#shelf{min-height:0}
h2.section{
  position:relative;
  margin:38px 0 15px;
  padding-left:18px;
  color:var(--plum);
  font-family:"Quicksand",sans-serif;
  font-size:1.65rem;
  font-weight:700;
  letter-spacing:-.025em;
  scroll-margin-top:18px;
}
h2.section:before{
  content:"";
  position:absolute;
  left:0;
  top:.2em;
  bottom:.2em;
  width:6px;
  border-radius:99px;
  background:var(--coral);
}
h2.section:first-of-type{margin-top:8px}

.toread{
  width:100%;
  border:0;
  border-collapse:separate;
  table-layout:auto;
}
.toread thead{display:none}
.toread tbody{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:18px;
  width:100%;
}
.toread tr{
  position:relative;
  display:block;
  min-width:0;
  padding:14px 14px 16px;
  overflow:hidden;
  background:#fff;
  border:1px solid var(--grid);
  border-radius:22px;
  box-shadow:0 8px 20px rgba(65,29,55,.08);
  transition:transform .2s ease,box-shadow .2s ease;
}
.toread tr:hover{
  transform:translateY(-5px) rotate(-.3deg);
  box-shadow:0 15px 28px rgba(65,29,55,.15);
}
.toread tr:before{
  content:counter(book);
  counter-increment:book;
  position:absolute;
  z-index:0;
  top:-24px;
  right:-4px;
  color:rgba(116,21,91,.10);
  font-family:"Quicksand",sans-serif;
  font-size:7rem;
  font-weight:700;
  line-height:1;
}
.toread tbody{counter-reset:book}
.toread tr:nth-child(4n+1){background:linear-gradient(160deg,#fff 0%,#fff 74%,#f3e7f4 100%)}
.toread tr:nth-child(4n+2){background:linear-gradient(160deg,#fff 0%,#fff 74%,#e9f7fb 100%)}
.toread tr:nth-child(4n+3){background:linear-gradient(160deg,#fff 0%,#fff 74%,#fff3c9 100%)}
.toread tr:nth-child(4n+4){background:linear-gradient(160deg,#fff 0%,#fff 74%,#f8dfe8 100%)}
.toread td{
  position:relative;
  z-index:1;
  display:block;
  width:100%;
  min-width:0;
  padding:0;
  border:0!important;
  overflow-wrap:anywhere;
}
.toread td.t .cover-wrap{
  display:block;
  width:100%;
  min-width:0;
}
.toread td.t .cover{
  display:block;
  width:min(100%,170px);
  margin:0 auto;
  height:auto;
  aspect-ratio:2/3;
  object-fit:cover;
  border-radius:12px;
  box-shadow:0 8px 14px rgba(35,15,30,.16);
}
.toread td.t .book-title{
  display:block;
  margin-top:12px;
  color:var(--plum);
  font-family:"Quicksand",sans-serif;
  font-size:15px;
  font-weight:700;
  line-height:1.2;
}
.toread td.a{
  margin-top:5px;
  color:var(--muted);
  font-size:13px;
  line-height:1.25;
}
.toread td.p{
  margin-top:7px;
  color:var(--plum-2);
  font-family:"Quicksand",sans-serif;
  font-size:11px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
}
.section-end{
  margin:8px 0 20px;
  display:flex;
  justify-content:flex-end;
}
.section-end a{
  color:var(--muted);
  font-size:.78rem;
  text-decoration:none;
}
.section-end a:hover{text-decoration:underline}

.read-desktop{display:block}
.read-mobile{display:none}
.read-card{
  display:grid;
  grid-template-columns:minmax(240px,38%) minmax(0,62%);
  width:100%;
  margin:0 0 22px;
  overflow:hidden;
  background:#fff;
  border:1px solid var(--grid);
  border-radius:24px;
  box-shadow:0 10px 25px rgba(65,29,55,.09);
}
.read-card:nth-child(4n+1) .read-cover-pane{
  background:var(--plum);
}

.read-card:nth-child(4n+2) .read-cover-pane{
  background:var(--cranberry);
}

.read-card:nth-child(4n+3) .read-cover-pane{
  background:var(--pumpkin);
}

.read-card:nth-child(4n+4) .read-cover-pane{
  background:var(--mustard);
}
.read-cover-pane .cover{
  width:auto;
  height:auto;
  max-width:100%;
  max-height:520px;
  aspect-ratio:2/3;
  object-fit:contain;
  border-radius:10px;
  box-shadow:0 12px 24px rgba(35,15,30,.2);
}
.read-cover-pane .cover-ph{
  width:70%;
  aspect-ratio:2/3;
  border:0;
  border-radius:10px;
}
.read-info{
  min-width:0;
  padding:30px 34px 32px;
}
.read-info-head{margin:0 0 18px}
.read-info .book-title{
  color:var(--plum);
  font-family:"Quicksand",sans-serif;
  font-size:clamp(1.45rem,3vw,2.2rem);
  font-weight:700;
  line-height:1.05;
  overflow-wrap:anywhere;
}
.read-author{
  margin-top:8px;
  color:var(--muted);
  font-size:1rem;
}
.read-ratings{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin:0 0 20px;
}
.read-rating{
  display:flex;
  align-items:center;
  gap:7px;
  padding:6px 10px;
  background:#faf1f6;
  border:1px solid #ead5df;
  border-radius:999px;
  white-space:nowrap;
}
.read-rating .rating-label{
  display:inline;
  color:var(--plum);
  font-family:"Quicksand",sans-serif;
  font-size:.68rem;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
}
.review{margin:.15em 0 .8em;line-height:1.55}
.lines{list-style:none;margin:0;padding:0}
.lines li{
  border-top:1px solid var(--rule);
  padding:10px 0 0;
  color:var(--muted);
  font-style:italic;
  margin:10px 0 0;
  line-height:1.45;
}
.lines li:first-child{border-top:0;padding-top:0;margin-top:0}
.stars .on{color:var(--star)}
.stars .off{color:#ded6d8}
.review a{color:var(--link);text-decoration:underline;text-underline-offset:2px}
.review code{
  font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:.85em;
  background:var(--code-bg);
  padding:.1em .35em;
  border-radius:4px;
}
.state{color:var(--muted);font-style:italic}

.foot{display:none}

@media(max-width:900px){
  body{padding:16px}
  .wrap{min-height:calc(100vh - 32px);padding:26px 24px 40px;border-radius:22px}
  .toread tbody{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .read-card{grid-template-columns:34% minmax(0,66%)}
  .read-info{padding:24px}
}

@media(max-width:620px){
  body{padding:10px;background:linear-gradient(145deg,#3b1032,#7b2b63)}
  .wrap{
    width:100%;
    min-height:calc(100vh - 20px);
    padding:18px 14px 28px;
    border-radius:16px;
  }
  .masthead{margin-bottom:14px}
  .masthead h1{font-size:clamp(32px,10vw,44px)}
  .masthead p{display:block;margin:5px 0 0;font-size:.9rem}
  .masthead .rule{height:6px;margin-top:13px}
  .nav{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:20px}
  .nav a{text-align:center;padding:7px 8px}
  h2.section{font-size:1.35rem;margin:28px 0 12px}
  .toread tbody{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .toread tr{padding:9px 9px 12px;border-radius:16px}
  .toread tr:before{font-size:5rem;top:-15px}
  .toread td.t .cover{width:92%;border-radius:9px}
  .toread td.t .book-title{margin-top:8px;font-size:12px}
  .toread td.a{font-size:11px}
  .read-desktop{display:none}
  .read-mobile{display:block}
  .read{display:block;border:0;width:100%;table-layout:auto}
  .read thead{display:none}
  .read tbody{display:block;width:100%}
  .read .book-row{
    display:block;
    width:100%;
    margin:0;
    background:#fff;
    border:1px solid var(--grid);
    border-bottom:0!important;
    border-radius:16px 16px 0 0;
    overflow:hidden;
  }
  .read .book-row td{
    display:block;
    width:100%;
    padding:0!important;
    border:0!important;
  }
  .read .book-row td.t .cover-wrap{display:block;width:100%;padding:14px}
  .read .book-row td.t .cover{display:block;width:82%;height:auto;aspect-ratio:2/3;object-fit:cover;border-radius:10px;margin:0 auto;box-shadow:0 8px 18px rgba(35,15,30,.15)}
  .read .book-row td.t .book-title{
    display:block;
    padding:0 14px;
    text-align:center;
    color:var(--plum);
    font-family:"Quicksand",sans-serif;
    font-size:1.08rem;
    font-weight:700;
    line-height:1.2;
  }
  .read .book-row td.a{
    padding:5px 14px 0!important;
    color:var(--muted);
    font-size:.95rem;
    text-align:center;
  }
  .read .book-row td.s{
    display:inline-flex;
    align-items:center;
    gap:5px;
    width:50%;
    padding:12px 14px 14px!important;
    font-size:.9rem;
    white-space:nowrap;
  }
  .read .book-row td.s:nth-child(4){justify-content:flex-end;text-align:right}
  .read .book-row td.s .rating-label{
    display:inline;
    color:var(--plum);
    font-family:"Quicksand",sans-serif;
    font-size:.65rem;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
  }
  .read .detail-row{
    display:block;
    width:100%;
    margin:0 0 20px;
    background:#fff;
    border:1px solid var(--grid)!important;
    border-top:0!important;
    border-radius:0 0 16px 16px;
    overflow:hidden;
  }
  .read .detail-row td{display:block;width:100%;padding:0 14px 16px!important;border:0!important}
}

</style></head>

<body><div class="wrap"><header class="masthead" id="top"><h1>Book Club</h1><p>Reading &amp; Read</p><hr class="rule"/></header><nav class="nav" aria-label="Book Club sections"><a href="#general">General</a><a href="#sapphic">Sapphic</a><a href="#classic">Classic</a><a href="#read">Read</a></nav><main id="shelf"><p class="state">Loading the shelf…</p></main><footer class="foot"></footer></div>
<script>
(()=>{const shelf=document.getElementById('shelf'),READERS=['RGF','LAB'];const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
function coverImg(isbn){if(!isbn)return '<img class="cover" src="https://dryofg8nmyqjw.cloudfront.net/images/no-cover.png" alt="No cover available" loading="lazy">';const clean=isbn.replace(/[^0-9Xx]/g,'');const url='https://covers.openlibrary.org/b/isbn/'+encodeURIComponent(clean)+'-M.jpg?default=false';return '<img class="cover" src="'+url+'" alt="" loading="lazy" onerror="this.onerror=null;this.src=\'https://dryofg8nmyqjw.cloudfront.net/images/no-cover.png\';this.alt=\'No cover available\'">'}
function bookLink(title,author,isbn){const q=encodeURIComponent((isbn||'').replace(/[^0-9Xx]/g,''));return '<a class="book-link" href="https://www.goodreads.com/search?q='+q+'" target="_blank" rel="noopener">'+esc(title)+'</a>'}
function coverLink(isbn){return '<a class="cover-link" href="'+(isbn?'https://openlibrary.org/isbn/'+encodeURIComponent(isbn.replace(/[^0-9Xx]/g,'')):'#')+'" target="_blank" rel="noopener">'+coverImg(isbn)+'</a>'}
function stars(v){const n=Math.max(0,Math.min(5,parseInt(v,10)||0));return '<span class="stars">'+[1,2,3,4,5].map(i=>'<span class="'+(i<=n?'on':'off')+'">★</span>').join('')+'</span>'}
function parse(md){const lines=md.split(/\r?\n/),blocks=[];let mode=null,curBook=null,curRead=null,curList=null;const flushBook=()=>{if(curBook&&curRead){curBook.review=curBook.reviewLines.join(' ').trim();curRead.books.push(curBook);curBook=null}};for(const raw of lines){const line=raw.replace(/\s+$/,'');const sec=line.match(/^#\s+(.*)/);if(sec){flushBook();const heading=sec[1].trim();if(heading.toLowerCase()==='read'){curRead={type:'read',books:[]};blocks.push(curRead);mode='read';curList=null}else{curList={type:'list',title:heading,items:[]};blocks.push(curList);mode='toread';curRead=null}continue}if(mode==='read'){const bk=line.match(/^##\s+(.*)/);if(bk){flushBook();const p=bk[1].split('|').map(s=>s.trim());curBook={title:p[0]||'',author:p[1]||'',stars:[p[2]||'',p[3]||''],isbn:p[4]||'',reviewLines:[],lines:[]};continue}if(!curBook)continue;const fav=line.match(/^\s*-\s+(.*)/);if(fav){curBook.lines.push(fav[1].trim());continue}if(line.trim()==='')continue;curBook.reviewLines.push(line.trim())}else if(mode==='toread'){if(line.trim()===''||!curList)continue;const p=line.split('|').map(s=>s.trim());curList.items.push({title:p[0]||'',author:p[1]||'',isbn:p[2]||''})}}flushBook();return blocks}
function render(blocks){const hasContent=blocks.some(b=>(b.type==='read'&&b.books.length)||(b.type==='list'&&b.items.length));if(!hasContent){shelf.innerHTML='<p class="state">No books yet — add some in books.md.</p>';return}const pageLists=/^To read - (General|Sapphic|Classic)$/i;const listTable=list=>{if(!list.items.length)return '';const showPages=pageLists.test(list.title);const id=listId(list.title);let s='<section id="'+id+'"><h2 class="section">'+esc(list.title)+(id==='general'?'<span class="general-status" style="color:var(--muted);font-family:inherit;font-size:50%;font-weight:400;margin-left:.5em">(** 1/2 already read)</span>':'')+'</h2><table class="toread"><thead><tr><th>Title</th><th>Author</th>'+(showPages?'<th>Pages</th>':'')+'</tr></thead><tbody>';list.items.forEach(b=>{const isbn=(b.isbn||'').replace(/[^0-9]/g,'');s+='<tr><td class="t"><span class="cover-wrap">'+coverLink(b.isbn)+ '<span class="book-title">'+esc(b.title)+'</span></span></td><td class="a">'+esc(b.author)+'</td>'+(showPages?'<td class="p" data-pages-isbn="'+esc(isbn)+'"></td>':'')+'</tr>'});s+='</tbody></table>'+sectionEnd(id)+'</section>';return s};const readTable=books=>{if(!books.length)return '';let desktop='<div class="read-desktop">',mobile='<div class="read-mobile"><table class="read"><thead><tr><th>Book</th><th>Author</th><th>'+esc(READERS[0])+'</th><th>'+esc(READERS[1])+'</th></tr></thead><tbody>';books.forEach(b=>{desktop+='<article class="read-card"><div class="read-cover-pane">'+coverLink(b.isbn)+'</div><div class="read-info"><div class="read-info-head"><div class="book-title">'+esc(b.title)+'</div><div class="read-author">'+esc(b.author)+'</div></div><div class="read-ratings"><div class="read-rating"><span class="rating-label">'+esc(READERS[0])+'</span>'+stars(b.stars[0])+'</div><div class="read-rating"><span class="rating-label">'+esc(READERS[1])+'</span>'+stars(b.stars[1])+'</div></div>'+(b.review?'<p class="review">'+inline(b.review)+'</p>':'')+(b.lines.length?'<ul class="lines">'+b.lines.map(l=>'<li>'+esc(l)+'</li>').join('')+'</ul>':'')+'</div></article>';mobile+='<tr class="book-row"><td class="t"><span class="cover-wrap">'+coverLink(b.isbn)+'<span class="book-title">'+esc(b.title)+'</span></span></td><td class="a">'+esc(b.author)+'</td><td class="s"><span class="rating-label">'+esc(READERS[0])+'</span>'+stars(b.stars[0])+'</td><td class="s"><span class="rating-label">'+esc(READERS[1])+'</span>'+stars(b.stars[1])+'</td></tr>';if(b.review||b.lines.length){mobile+='<tr class="detail-row"><td colspan="4">';if(b.review)mobile+='<p class="review">'+inline(b.review)+'</p>';if(b.lines.length)mobile+='<ul class="lines">'+b.lines.map(l=>'<li>'+esc(l)+'</li>').join('')+'</ul>';mobile+='</td></tr>'}});desktop+='</div>';mobile+='</tbody></table></div>';return '<section id="read"><h2 class="section">Read</h2>'+desktop+mobile+sectionEnd('read')+'</section>'};let h='';const lists=blocks.filter(b=>b.type==='list');const read=blocks.find(b=>b.type==='read');lists.forEach(b=>{h+=listTable(b)});if(read)h+=readTable(read.books);shelf.innerHTML=h;loadPages(blocks);function scrollToSection(target){const top=target.getBoundingClientRect().top-shelf.getBoundingClientRect().top+shelf.scrollTop;shelf.scrollTo({top:Math.max(0,top),behavior:'smooth'})}document.querySelectorAll('.nav a,.return-top').forEach(link=>link.addEventListener('click',e=>{e.preventDefault();const target=document.querySelector(link.getAttribute('href'));if(target)scrollToSection(target)}))}
function listId(title){const m=title.match(/^To read - (General|Sapphic|Classic)$/i);return m?m[1].toLowerCase():''}function sectionEnd(id){return '<div class="section-end"><a href="#'+id+'" class="return-top">Return to top </a></div>'}async function loadPages(blocks){const targets=blocks.filter(b=>b.type==='list'&&/^To read - (General|Sapphic|Classic)$/i.test(b.title));const books=targets.flatMap(b=>b.items).filter(b=>/^97\d{11}$/.test((b.isbn||'').replace(/[^0-9]/g,'')));if(!books.length)return;const unique=[...new Set(books.map(b=>b.isbn.replace(/[^0-9]/g,'')))];for(let i=0;i<unique.length;i+=20){const ids=unique.slice(i,i+20);try{const r=await fetch('https://openlibrary.org/api/books?bibkeys='+encodeURIComponent(ids.map(id=>'ISBN:'+id).join(','))+'&jscmd=data&format=json');if(!r.ok)continue;const data=await r.json();const missing=[];ids.forEach(id=>{const pages=data['ISBN:'+id]?.number_of_pages;if(pages){document.querySelectorAll('[data-pages-isbn="'+id+'"]').forEach(el=>{el.textContent=pages+' pp'})}else missing.push(id)});for(const id of missing){try{const gr=await fetch('https://www.googleapis.com/books/v1/volumes?q=isbn:'+encodeURIComponent(id));if(!gr.ok)continue;const gd=await gr.json();const pageCount=gd?.items?.[0]?.volumeInfo?.pageCount;if(pageCount)document.querySelectorAll('[data-pages-isbn="'+id+'"]').forEach(el=>{el.textContent=pageCount+' pp'})}catch(_){} }}catch(_){} }}
fetch('books.md?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(t=>render(parse(t))).catch(err=>{shelf.innerHTML='<p class="state">Couldn’t load <b>books.md</b> ('+esc(err.message)+').<br>If you opened this file straight from your computer, browsers block that — view it on your live site. Make sure books.md sits in the same folder as this page.</p>'})})();
</script></body></html>
