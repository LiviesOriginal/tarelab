(()=>{const TMDB_KEY=['06cf868a','53dce614','9194addb','d212d29d'].join('');const shelf=document.getElementById('shelf'),nav=document.getElementById('nav');const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');function poster(imdb){const id=(imdb||'').trim();if(!/^tt\d+$/i.test(id))return '';return '<img class="cover" data-imdb="'+id+'" alt="" loading="lazy">'}function titleLink(title,imdb){const id=(imdb||'').trim();if(!/^tt\d+$/i.test(id))return '<span class="ttl">'+esc(title)+'</span>';return '<a class="ttl" href="https://www.imdb.com/title/'+id+'/" target="_blank" rel="noopener">'+esc(title)+'</a>'}async function loadPosters(){if(!TMDB_KEY||TMDB_KEY==='YOUR_TMDB_KEY')return;const imgs=[...document.querySelectorAll('img.cover[data-imdb]')],cache={};for(const img of imgs){const id=img.getAttribute('data-imdb');try{if(!(id in cache)){const r=await fetch('https://api.themoviedb.org/3/find/'+encodeURIComponent(id)+'?external_source=imdb_id&api_key='+encodeURIComponent(TMDB_KEY));const d=await r.json();const hit=(d&&((d.movie_results&&d.movie_results[0])||(d.tv_results&&d.tv_results[0])))||null;cache[id]=(hit&&hit.poster_path)?('https://image.tmdb.org/t/p/w500'+hit.poster_path):''}if(cache[id])img.src=cache[id];else img.remove()}catch(_){img.remove()}}}function parse(text){const lines=text.replace(/\r\n/g,'\n').split('\n');const sections=[];let cur=null,curFilm=null;const flush=()=>{if(curFilm&&cur){curFilm.notes=curFilm.noteLines.join(' ').trim();cur.films.push(curFilm);curFilm=null}};for(const raw of lines){const line=raw.replace(/\s+$/,'');const h2=line.match(/^##\s+(.*)/);if(h2){if(cur){flush();const p=h2[1].split('|').map(s=>s.trim());curFilm={title:p[0]||'',released:p[1]||'',imdb:p[2]||'',noteL
