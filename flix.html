<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Screens Big and Small</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,0..72,400&display=swap" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="/moonfavicon.svg">
<style>
:root{--bg:#fbfaf7;--season-bg:#7956a8;--ink:#1e1d1b;--muted:#8a857d;--rule:#e8e4dc;--grid:#d7d0c4}
*{box-sizing:border-box}html,body{margin:0}html{scroll-behavior:smooth}body{background:var(--bg);color:var(--ink);font-family:"Newsreader",Georgia,serif;font-size:19px;line-height:1.7;padding:0 20px;overflow-x:hidden}.wrap{max-width:760px;margin:0 auto;padding:32px 0 48px}.masthead{margin-bottom:22px}.masthead h1{font-family:"Fraunces",serif;font-weight:600;font-size:clamp(30px,6vw,44px);letter-spacing:-.02em;line-height:1.05;margin:0}.masthead .rule{height:1px;background:var(--rule);border:0;margin:18px 0 0}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 26px}.nav a{display:inline-block;padding:7px 13px;border:1px solid #6a4b91;border-radius:999px;background:var(--season-bg);color:#fff;font-family:"Fraunces",serif;font-size:.78rem;font-weight:600;text-decoration:none;box-shadow:0 2px 4px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.22)}.nav a:hover{background:#68468f}.state{color:var(--muted);font-style:italic}h2.section{font-family:"Fraunces",serif;font-weight:600;font-size:1.5rem;letter-spacing:-.01em;margin:28px 0 10px;scroll-margin-top:18px}.toread{width:100%;border:0;margin:0}.toread thead{display:none}.toread tbody{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}.toread tr{display:block;min-width:0;overflow:hidden;background:#fff;border:1px solid var(--grid);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:7px}.toread td{display:block;width:100%;border:0!important;padding:0!important;overflow-wrap:anywhere}.cover-wrap{display:block;width:100%;min-width:0}.cover-link{display:block;line-height:0}.toread .cover{display:block;width:92%;margin:0 auto;height:auto;aspect-ratio:2/3;object-fit:cover;border-radius:7px}.book-title{display:block;font-family:"Fraunces",serif;font-weight:600;line-height:1.18;overflow-wrap:anywhere}.toread .book-title{margin-top:7px;font-size:12px}.released{color:var(--muted);line-height:1.2}.toread .released{margin-top:3px;font-size:12px}.section-end{margin:0 0 18px;display:flex;justify-content:flex-end;line-height:1.2}.section-end a{color:var(--muted);font-size:.78rem;text-decoration:none}.read{width:100%;border:0;margin:0}.read thead{display:none}.read tbody{display:block;width:100%}.film-row{display:block;width:100%;margin:0 0 22px;background:#fff;border:1px solid var(--grid);border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}.film-row td{display:block;width:100%;border:0!important;padding:0!important}.film-row td.t .cover-wrap{display:block;padding:14px;background:#eee5f6;border-bottom:1px solid #c8b1df}.film-row td.t .cover{display:block;width:82%;height:auto;aspect-ratio:2/3;object-fit:cover;border-radius:8px;margin:0 auto;border:2px solid #b99bd5}.film-row .book-title{padding:0 14px;text-align:center;font-size:1.12rem;font-weight:500}.film-row .released{padding:5px 14px 0;text-align:center;font-size:1rem}.ratings{display:flex;width:100%;padding:12px 14px 14px;font-size:.95rem}.rating{width:50%;display:flex;align-items:center;gap:5px}.rating:last-child{justify-content:flex-end;text-align:right}.rating-label{font-family:"Fraunces",serif;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.rating-stars{letter-spacing:.04em;white-space:nowrap}.desktop-review{padding:0 14px 16px}.review{margin:0 0 .7em;line-height:1.55}.lines{list-style:none;margin:0;padding:0}.lines li{border-top:1px solid var(--rule);padding:10px 0 0;color:var(--muted);font-style:italic;margin:10px 0 0;line-height:1.45}.lines li:first-child{border-top:0;padding-top:0;margin-top:0}.cover-ph{display:flex;align-items:center;justify-content:center;width:82%;aspect-ratio:2/3;margin:0 auto;border-radius:8px;background:#eee5f6;border:2px solid #b99bd5;color:var(--muted);font-family:"Fraunces",serif;font-size:12px;text-align:center}
@media(min-width:521px){html,body{height:100%;overflow:hidden}body{background:linear-gradient(145deg,#4d326f 0%,#7956a8 42%,#9b72c2 70%,#5c3d82 100%);padding:32px 28px;min-height:100vh}.wrap{position:relative;width:min(1180px,100%);height:calc(100vh - 64px);max-width:none;margin:0 auto;padding:34px 42px 24px;background:#fff;border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.2);display:flex;flex-direction:column;overflow:hidden}.masthead{margin-bottom:8px;flex:0 0 auto}.nav{position:absolute;right:42px;top:34px;gap:7px;margin-bottom:0;flex:0 0 auto}.nav a{padding:7px 10px;border-radius:9px;text-align:center;white-space:nowrap;font-size:.72rem}.nav:empty{display:none}#shelf{min-height:0;flex:1 1 auto;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scroll-padding-top:8px}h2.section{font-size:1.5rem;margin:30px 0 12px}.toread tbody{grid-template-columns:repeat(auto-fill,minmax(175px,190px));justify-content:space-between;gap:14px}.toread tr{padding:9px}.toread td.t .cover{width:min(92%,150px);box-shadow:0 2px 7px rgba(73,47,105,.2);border:1px solid #c8b1df}.toread td.t .book-title{margin-top:9px;font-size:13px}.toread td.a{margin-top:4px;font-size:13px}.toread td.p{margin-top:6px;font-size:12px}.read tbody{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}.film-row{display:grid;grid-template-columns:40% minmax(0,60%);width:100%;margin:0;background:#fff;border-radius:12px}.film-row td.t{grid-column:1;grid-row:1;display:flex;align-items:center;justify-content:center;padding:16px!important;background:#fff;border-right:1px solid #c8b1df!important}.film-row td.t .cover-wrap{display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:0;background:#fff;border:0}.film-row td.t .cover{width:auto;height:auto;max-width:100%;max-height:calc(100vh - 200px);object-fit:contain;margin:0}.film-row td.t .book-title{display:none}.film-row td.watched-info{grid-column:2;grid-row:1;display:block;padding:18px 21px 20px!important;min-width:0;background:#fff}.film-row .watched-info .book-title{padding:18px 21px 0;margin:-18px -21px 0;text-align:left;font-size:1.09rem;background:var(--season-bg);color:#fff}.film-row .watched-info .released{padding:5px 21px 13px;margin:0 -21px;background:var(--season-bg);color:rgba(255,255,255,.82);font-size:.75rem;text-align:left}.film-row .watched-info .ratings{padding:13px 0;font-size:.71rem}.film-row .watched-info .rating:last-child{justify-content:flex-start;text-align:left}.film-row .watched-info .rating-label,.film-row .watched-info .rating-stars{color:var(--ink)}.film-row .watched-info .desktop-review{padding:0}.film-row .watched-info .desktop-review.review{font-size:.78rem}.film-row .watched-info .lines li{font-size:.76rem;color:var(--ink);padding:8px 0 0;margin:8px 0 0}.detail-row{display:none}}
@media(max-width:520px){body{font-size:18px;background:linear-gradient(145deg,#5c3d82 0%,#7956a8 45%,#9b72c2 72%,#4d326f 100%);padding:calc(12px + env(safe-area-inset-top)) 10px 12px;min-height:100vh;height:100vh;overflow:hidden}.wrap{width:100%;max-width:760px;height:calc(100vh - 24px - env(safe-area-inset-top));margin:0 auto;padding:18px 16px 20px;background:#fff;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);overflow:hidden;display:flex;flex-direction:column}.masthead{margin-bottom:10px}.masthead h1{font-size:clamp(30px,9vw,40px);white-space:nowrap}.masthead .rule{display:none}.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:14px}.nav a{text-align:center;padding:6px 4px;font-size:.72rem}.nav:empty{display:none}#shelf{min-height:0;flex:1 1 auto;overflow-y:auto;overflow-x:hidden}h2.section{font-size:1.3rem;margin:22px 0 10px}.toread tbody{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.toread tr{padding:7px}.toread .book-title{font-size:12px}.toread .released{font-size:12px}.film-row{margin-bottom:22px}.film-row td.t .cover{width:82%}.ratings{font-size:.9rem}.detail-row{display:none}}
</style>
</head>
<body>
<div class="wrap">
<header class="masthead" id="top"><h1>Screens Big and Small</h1><hr class="rule" /></header>
<nav class="nav" aria-label="Flix sections"></nav>
<main id="shelf"><p class="state">Loading the shelf…</p></main>
</div>
<script>
(() => {
  const shelf=document.getElementById('shelf'), nav=document.querySelector('.nav');
  const TMDB_KEY='06cf868a53dce6149194addbd212d29d', coverCache={};
  const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');
  const slug=(title,used)=>{let base=(title||'section').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'section';let id=base,n=2;while(used.has(id))id=base+'-'+n++;used.add(id);return id};
  function poster(imdb,large=false){const id=(imdb||'').trim();if(!/^tt\d+$/i.test(id))return '<span class="cover-ph">No poster</span>';return '<a class="cover-link" href="https://www.imdb.com/title/'+encodeURIComponent(id)+'/" target="_blank" rel="noopener"><img class="cover" data-imdb="'+esc(id)+'" data-large="'+(large?'1':'0')+'" alt="" loading="lazy"></a>'}
  function stars(v){const n=parseFloat(String(v||'').replace(/[^0-9.]/g,''));if(!Number.isFinite(n))return '—';const full=Math.round(Math.max(0,Math.min(5,n)));return '★'.repeat(full)+'☆'.repeat(5-full)}
  async function loadPosters(){for(const img of [...document.querySelectorAll('img.cover[data-imdb]')]){const id=img.dataset.imdb;try{if(!(id in coverCache)){const r=await fetch('https://api.themoviedb.org/3/find/'+encodeURIComponent(id)+'?external_source=imdb_id&api_key='+encodeURIComponent(TMDB_KEY));const d=await r.json(),hit=(d&&(d.movie_results?.[0]||d.tv_results?.[0]))||null;coverCache[id]=hit?.poster_path?((img.dataset.large==='1'?'https://image.tmdb.org/t/p/w500':'https://image.tmdb.org/t/p/w342')+hit.poster_path):''}if(coverCache[id])img.src=coverCache[id];else img.replaceWith(document.createTextNode(''))}catch(_){img.replaceWith(document.createTextNode(''))}}}
  function parse(text){const sections=[];let cur=null,film=null;const flush=()=>{if(film&&cur){film.notes=film.noteLines.join(' ').trim();cur.films.push(film);film=null}};for(const raw of text.replace(/\r\n/g,'\n').split('\n')){const line=raw.replace(/\s+$/,'');const h1=line.match(/^#\s+(.*)/);if(h1){flush();cur={sourceTitle:h1[1].trim(),films:[]};sections.push(cur);continue}const h2=line.match(/^##\s+(.*)/);if(h2){if(!cur)continue;flush();const p=h2[1].split('|').map(s=>s.trim());film={title:p[0]||'',released:p[1]||'',imdb:p[2]||'',rgb:p[3]||'—',lab:p[4]||'—',noteLines:[],lines:[]};continue}if(!film)continue;const q=line.match(/^\s*-\s+(.*)/);if(q){film.lines.push(q[1].trim());continue}if(line.trim()!=='')film.noteLines.push(line.trim())}flush();return sections.filter(s=>s.films.length)}
  function render(sections){if(!sections.length){shelf.innerHTML='<p class="state">No films yet — add some in flix.md.</p>';nav.innerHTML='';return}const used=new Set();sections.forEach(s=>s.id=slug(s.sourceTitle,used));const navLabels=['Movies','Series','Watching','Watched'];nav.innerHTML=navLabels.map(label=>{const target=sections.find(s=>s.sourceTitle.toLowerCase().includes(label.toLowerCase()));return target?'<a href="#'+target.id+'">'+label+'</a>':''}).join('');let h='';sections.forEach(s=>{const watched=/\bwatched\b/i.test(s.sourceTitle);h+='<section id="'+s.id+'"><h2 class="section">'+esc(s.sourceTitle)+'</h2>';if(watched){h+='<table class="read"><tbody>';s.films.forEach(m=>{h+='<tr class="film-row"><td class="t"><span class="cover-wrap">'+poster(m.imdb,true)+'</span></td><td class="watched-info"><div class="book-title">'+esc(m.title)+'</div><div class="released">Released in '+esc(m.released)+'</div><div class="ratings"><span class="rating"><span class="rating-label">RGB</span><span class="rating-stars">'+stars(m.rgb)+'</span></span><span class="rating"><span class="rating-label">LAB</span><span class="rating-stars">'+stars(m.lab)+'</span></span></div>'+(m.notes||m.lines.length?'<div class="desktop-review">'+(m.notes?'<p class="review">'+esc(m.notes)+'</p>':'')+(m.lines.length?'<ul class="lines">'+m.lines.map(q=>'<li>'+esc(q)+'</li>').join('')+'</ul>':'')+'</div>':'')+'</td></tr>'}) ;h+='</tbody></table>'}else{h+='<table class="toread"><tbody>';s.films.forEach(m=>{h+='<tr><td class="t"><span class="cover-wrap">'+poster(m.imdb)+'</span><span class="book-title">'+esc(m.title)+'</span></td><td class="released">Released in '+esc(m.released)+'</td></tr>'});h+='</tbody></table>'}h+='<div class="section-end"><a class="return-top" href="#top">Return to top</a></div></section>'});shelf.innerHTML=h;loadPosters()}
  function scrollToSection(id){const el=document.getElementById(id);if(!el)return;const top=el.getBoundingClientRect().top-shelf.getBoundingClientRect().top+shelf.scrollTop;shelf.scrollTo({top:Math.max(0,top),behavior:'smooth'})}
  nav.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;e.preventDefault();scrollToSection(a.getAttribute('href').slice(1))});shelf.addEventListener('click',e=>{const a=e.target.closest('.return-top');if(!a)return;e.preventDefault();scrollToSection(a.getAttribute('href').slice(1))});
  fetch('flix.md?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(t=>render(parse(t))).catch(err=>{shelf.innerHTML='<p class="state">Couldn’t load <b>flix.md</b> ('+esc(err.message)+').</p>'});
})();
</script>
</body>
</html>
