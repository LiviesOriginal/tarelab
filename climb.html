@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=Spline+Sans+Mono:wght@500;600&display=swap');
* { box-sizing: border-box; }

.vg-root {
  --night-top:#161228; --night-bot:#2d2342; --dusk:#6b4a6e; --rose:#c97b6d;
  --lantern:#ffc861; --amber:#f0973f; --window:#ffd98a;
  --parchment:#f3ead7; --parchment2:#ece0c8; --ink:#34291f; --ink-soft:#6a5c4c;
  font-family:'Inter',system-ui,sans-serif; min-height:100%; background:var(--night-top);
  color:#efe7f2; display:flex; justify-content:center;
}
.vg-shell { width:100%; max-width:540px; display:flex; flex-direction:column; }

/* ---------- hero ---------- */
.vg-hero { position:relative; background:linear-gradient(180deg,var(--night-top) 0%,var(--night-bot) 60%,var(--dusk) 100%); padding:26px 20px 8px; overflow:hidden; }
.vg-eyebrow { font-size:11px; letter-spacing:.32em; text-transform:uppercase; color:var(--lantern); opacity:.85; text-align:center; margin:0 0 4px; }
.vg-title { font-family:'Fraunces',serif; font-weight:600; font-size:clamp(30px,9vw,42px); text-align:center; margin:0; color:#fbf3e3; text-shadow:0 2px 20px rgba(255,200,97,.18); }
.vg-sub { text-align:center; font-size:13px; color:#cdbfd6; margin:6px auto 0; max-width:340px; font-style:italic; font-family:'Fraunces',serif; }

.vg-clock { display:flex; justify-content:center; align-items:flex-end; gap:5px; margin:18px 0 6px; font-family:'Spline Sans Mono',monospace; }
.vg-seg { display:flex; flex-direction:column; align-items:center; min-width:54px; }
.vg-seg-num { font-size:clamp(34px,11vw,52px); font-weight:600; line-height:1; color:#fff3da; font-variant-numeric:tabular-nums; text-shadow:0 0 18px rgba(255,200,97,.3); }
.vg-seg-lab { font-family:'Inter',sans-serif; font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color:#b9a9c4; margin-top:8px; }
.vg-colon { font-size:clamp(24px,8vw,38px); color:var(--lantern); padding-bottom:20px; opacity:.55; }

.vg-mtn { width:100%; height:auto; display:block; margin-top:4px; }

.vg-stats { display:flex; justify-content:center; gap:16px; flex-wrap:wrap; margin-top:6px; font-size:12px; color:#cdbfd6; }
.vg-stats b { color:var(--lantern); font-weight:600; }

.vg-actions { display:flex; gap:10px; margin:18px 0 22px; }
.vg-btn { flex:1; border:none; border-radius:14px; padding:15px 12px; font-family:'Inter',sans-serif; font-size:14.5px; font-weight:600; cursor:pointer; transition:transform .12s ease,filter .12s ease; }
.vg-btn:active { transform:translateY(1px) scale(.99); }
.vg-btn-primary { background:linear-gradient(180deg,var(--lantern),var(--amber)); color:#3a2410; box-shadow:0 6px 22px rgba(240,151,63,.35); }
.vg-btn-primary:hover { filter:brightness(1.05); }
.vg-btn-ghost { background:rgba(255,255,255,.06); color:#d9cce0; border:1px solid rgba(255,255,255,.14); }
.vg-btn-ghost:hover { background:rgba(255,255,255,.11); }
.vg-btn:focus-visible, .vg-cheer:focus-visible, .vg-vote:focus-visible, .vg-submit:focus-visible, .vg-toss:focus-visible, .vg-start:focus-visible { outline:3px solid var(--window); outline-offset:2px; }
.vg-start { margin:12px auto 22px; display:block; border:none; cursor:pointer; background:linear-gradient(180deg,var(--lantern),var(--amber)); color:#3a2410; font-weight:600; font-size:15px; font-family:'Inter',sans-serif; padding:14px 30px; border-radius:14px; box-shadow:0 6px 22px rgba(240,151,63,.35); }

/* ---------- village panel ---------- */
.vg-village { background:linear-gradient(180deg,var(--parchment),var(--parchment2)); color:var(--ink); padding:24px 20px 28px; }
.vg-billie { display:flex; align-items:flex-end; gap:12px; margin-bottom:18px; }
.vg-goat { width:60px; height:60px; flex:0 0 60px; filter:drop-shadow(0 2px 6px rgba(0,0,0,.18)); }
.vg-bubble { position:relative; background:#fffdf7; color:#2a2018; border:1px solid rgba(52,41,31,.1); border-radius:14px; padding:11px 14px; font-size:14px; line-height:1.45; flex:1; box-shadow:0 1px 5px rgba(52,41,31,.08); }
.vg-bubble::before { content:""; position:absolute; left:-7px; bottom:14px; border-width:6px 8px 6px 0; border-style:solid; border-color:transparent #fffdf7 transparent transparent; }
.vg-bubble-name { display:block; font-family:'Spline Sans Mono',monospace; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:#b4452f; margin-bottom:3px; }
.vg-bubble-from { display:block; font-size:11px; color:var(--ink-soft); margin-top:5px; font-style:italic; }

.vg-energy-label { font-size:13px; font-weight:600; color:var(--ink); }
.vg-energy-mood { font-size:12px; font-style:italic; }
.vg-meter { height:10px; border-radius:999px; background:rgba(52,41,31,.12); overflow:hidden; }
.vg-meter-fill { height:100%; border-radius:999px; transition:width .5s ease, background .5s ease; }
.vg-cheer-row { display:flex; align-items:center; gap:12px; margin-top:13px; }
.vg-cheer { border:none; border-radius:12px; padding:12px 22px; font-family:'Inter',sans-serif; font-size:14.5px; font-weight:700; cursor:pointer; background:linear-gradient(180deg,var(--amber),#d97a2a); color:#fff; box-shadow:0 4px 14px rgba(217,122,42,.3); transition:transform .1s ease; }
.vg-cheer:active { transform:scale(.93); }
.vg-cheer-total { font-size:12.5px; color:var(--ink-soft); }
.vg-cheer-total b { color:var(--ink); }

.vg-div { height:1px; background:rgba(52,41,31,.12); margin:24px 0 20px; }

.vg-lines-title { font-family:'Fraunces',serif; font-weight:600; font-size:20px; margin:0; color:var(--ink); }
.vg-lines-sub { font-size:12.5px; color:var(--ink-soft); margin:5px 0 14px; }
.vg-input { width:100%; border:1px solid rgba(52,41,31,.18); border-radius:9px; padding:10px 11px; font-family:'Inter',sans-serif; font-size:14px; color:var(--ink); background:#fff; margin-bottom:9px; }
.vg-input:focus { outline:2px solid var(--amber); border-color:var(--amber); }
.vg-line-compose { display:flex; gap:8px; align-items:flex-start; }
.vg-line-compose .vg-input { margin-bottom:0; }
.vg-submit { border:none; background:var(--ink); color:var(--parchment); font-weight:600; padding:11px 16px; border-radius:10px; cursor:pointer; font-family:'Inter',sans-serif; font-size:14px; white-space:nowrap; }
.vg-submit:hover { filter:brightness(1.15); }
.vg-submit:disabled { opacity:.4; cursor:not-allowed; }

.vg-lines { display:flex; flex-direction:column; gap:9px; margin-top:16px; }
.vg-line { display:flex; align-items:center; gap:11px; background:#fffdf7; border:1px solid rgba(52,41,31,.1); border-radius:12px; padding:11px 13px; box-shadow:0 1px 4px rgba(52,41,31,.05); }
.vg-vote { flex:0 0 auto; display:flex; flex-direction:column; align-items:center; min-width:38px; border:1px solid rgba(52,41,31,.2); background:#fff; border-radius:9px; padding:5px 0; cursor:pointer; font-family:'Inter',sans-serif; color:var(--ink-soft); transition:all .12s ease; }

.vg-empty { text-align:center; color:var(--ink-soft); font-style:italic; font-family:'Fraunces',serif; padding:18px 10px; font-size:14px; }

@keyframes flicker { 0%,100%{transform:scaleY(1) scaleX(1);opacity:1;} 45%{transform:scaleY(1.08) scaleX(.94);opacity:.92;} 70%{transform:scaleY(.96) scaleX(1.04);opacity:1;} }
