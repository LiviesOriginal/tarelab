// ---- passphrase encryption (device-only) ----
async function deriveKey(pass, salt) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 120000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
const b64 = (buf) => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
const unb64 = (str) => Uint8Array.from(atob(str), (c) => c.charCodeAt(0));
async function encJSON(obj, pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pass, salt);
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { s: b64(salt), iv: b64(iv), ct: b64(ct) };
}
async function decJSON(blob, pass) {
  const key = await deriveKey(pass, unb64(blob.s));
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(blob.iv) }, key, unb64(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

          <div className="vg-clock" role="timer" aria-label="time since last contact">
            <div className="vg-seg"><span className="vg-seg-num">{dd}</span><span className="vg-seg-lab">days</span></div>
            <span className="vg-colon">:</span>
            <div className="vg-seg"><span className="vg-seg-num">{pad(hh)}</span><span className="vg-seg-lab">hrs</span></div>
            <span className="vg-colon">:</span>
            <div className="vg-seg"><span className="vg-seg-num">{pad(mm)}</span><span className="vg-seg-lab">min</span></div>
            <span className="vg-colon">:</span>
            <div className="vg-seg"><span className="vg-seg-num">{pad(ss)}</span><span className="vg-seg-lab">sec</span></div>
          </div>

          <Mountain daysFloat={daysFloat} mood={mood} />

          <div className="vg-stats">
            <span>Longest: <b>{longestDays}d</b></span>
            <span>Talked down: <b>{state.saves || 0}</b></span>
            <span>Restarts: <b>{state.resetCount || 0}</b></span>
          </div>

          {state.reason && <p className="vg-herosub" style={{ fontStyle: "italic", fontFamily: "'Fraunces',serif" }}>“{state.reason}”</p>}

          <div className="vg-billie" style={{ maxWidth: 430, margin: "18px auto 0" }}>
            <GoatBillie />
            <div className="vg-bubble">
              <span className="vg-bubble-name">Billie</span>
              {billie || "…"}
            </div>
          </div>

          <div className="vg-actions" style={{ maxWidth: 430, margin: "20px auto 16px" }}>
            <button className="vg-btn vg-btn-primary" onClick={openPanic}>Talk me out of it</button>
            <button className="vg-btn vg-btn-ghost" onClick={() => setConfirmCave(true)}>I caved</button>
          </div>

          <div style={{ display: "flex", justifyContent: "center", gap: 8, flexWrap: "wrap", marginBottom: 6 }}>
            <button className="vg-link" onClick={doShare}>Share my climb</button>
            <span style={{ color: "#6b5b7a" }}>·</span>
            <button className="vg-link" onClick={openReason}>{state.reason ? "Edit my reason" : "Set my reason"}</button>
            <span style={{ color: "#6b5b7a" }}>·</span>
            <button className="vg-link" onClick={toggleSound}>Sound: {state.sound ? "on" : "off"}</button>
          </div>
        </section>

        <section className="vg-drawer">
          <h2 className="vg-drawer-title">The unsent drawer</h2>
          <p className="vg-drawer-sub">Write the text. Do not send the text. Billie handles disposal.</p>

          {!drawerBlobExists ? (
            <div>
              <p className="vg-drawer-priv" style={{ marginBottom: 10 }}>Set a passphrase to lock this drawer. It's stored only on this device and encrypted — nobody can read it without the passphrase, not even you if you forget it.</p>
              <input className="vg-textarea" style={{ minHeight: 0 }} type="password" placeholder="Choose a passphrase" value={passInput} onChange={(e) => setPassInput(e.target.value)} />
              <input className="vg-textarea" style={{ minHeight: 0 }} type="password" placeholder="Repeat it" value={passInput2} onChange={(e) => setPassInput2(e.target.value)} />
              {passErr && <p className="vg-drawer-priv" style={{ color: "#e0a3a3" }}>{passErr}</p>}
              <div className="vg-drawer-row"><button className="vg-toss" onClick={setDrawerPassphrase}>Lock it down</button></div>
            </div>
          ) : !drawerReady ? (
            <div>
              <p className="vg-drawer-priv" style={{ marginBottom: 10 }}>Locked. Enter your passphrase to open the drawer on this device.</p>
              <input className="vg-textarea" style={{ minHeight: 0 }} type="password" placeholder="Passphrase" value={passInput}
                onChange={(e) => { setPassErr(""); setPassInput(e.target.value); }} onKeyDown={(e) => { if (e.key === "Enter") unlockDrawer(); }} />
              {passErr && <p className="vg-drawer-priv" style={{ color: "#e0a3a3" }}>{passErr}</p>}
              <div className="vg-drawer-row"><button className="vg-toss" onClick={unlockDrawer}>Unlock</button></div>
            </div>
          ) : (
            <>
              <textarea className="vg-textarea" placeholder="The thing you absolutely should not send at 1am…" value={draftToThem} onChange={(e) => setDraftToThem(e.target.value)} maxLength={1000} />
              <div className="vg-drawer-row">
                <span className="vg-drawer-priv">Private — encrypted on this device only. <button className="vg-link" style={{ color: "#c9b79c", fontSize: 11 }} onClick={lockDrawer}>Lock now</button></span>
                <button className="vg-toss" disabled={!draftToThem.trim()} onClick={tossUnsent}>Don't send it</button>
              </div>
              {drawerEntries.length > 0 && (
                <>
                  <p className="vg-count">Disasters intercepted: <b>{drawerEntries.length}</b></p>
                  <div className="vg-scraps">
                    {drawerEntries.map((u) => {
                      const open = revealed.has(u.id);
                      return (
                        <div className="vg-scrap" key={u.id}>
                          <span className="vg-stamp">{u.verdict}</span>
                          <div className={"vg-scrap-body" + (open ? "" : " blur")} onClick={() => toggleReveal(u.id)}>{u.text}</div>
                          <span className="vg-scrap-hint" onClick={() => toggleReveal(u.id)}>{open ? "tap to hide it again" : "tap to relive your mistake"}</span>
                          <div className="vg-scrap-time">{timeAgo(u.ts)}</div>
                        </div>
                      );
                    })}
                  </div>
                </>
              )}
            </>
          )}
        </section>

        <div className="vg-foot">Every second on the clock is a second you didn't text back.</div>
      </div>

      {panic && (
        <div className="vg-overlay" onClick={(e) => { if (e.target === e.currentTarget) setPanic(false); }}>
          <div className="vg-card">
            <p className="vg-card-eyebrow">Before you text them</p>
            <p className="vg-card-reason">{REASONS[reasonIdx]}</p>
            {state.reason && <p style={{ fontStyle: "italic", color: "#cdbfd6", fontSize: 14, margin: "0 0 20px", lineHeight: 1.4 }}>Your reason: “{state.reason}”</p>}
            <div className="vg-card-actions">
              <button className="vg-btn vg-btn-primary" onClick={survived}>Okay. Phone down.</button>
              <button className="vg-link" onClick={nextReason}>Give me another reason</button>
            </div>
          </div>
        </div>
      )}

      {milestone !== null && (
        <div className="vg-overlay" onClick={(e) => { if (e.target === e.currentTarget) setMilestone(null); }}>
          <div className="vg-card">
            <p className="vg-card-eyebrow">{milestone >= 30 ? "The summit" : "Milestone — " + (WLABEL[milestone] || milestone + "d")}</p>
            <p className="vg-card-reason">{BILLIE_MILESTONES[milestone] || "Higher."}</p>
            <div className="vg-card-actions">
              <button className="vg-btn vg-btn-primary" onClick={() => { setMilestone(null); doShare(); }}>Share it</button>
              <button className="vg-link" onClick={() => setMilestone(null)}>Keep climbing</button>
            </div>
          </div>
        </div>
      )}

      {confirmCave && (
        <div className="vg-overlay" onClick={(e) => { if (e.target === e.currentTarget) setConfirmCave(false); }}>
          <div className="vg-card">
            <p className="vg-card-eyebrow">Reset the clock</p>
            <p className="vg-card-reason" style={{ fontSize: 20, marginBottom: 18 }}>Climb back down and start over? No shame in it — the clock's here whenever you're ready to climb again.</p>
            <div className="vg-card-actions">
              <button className="vg-btn vg-btn-primary" onClick={caved}>Yes, I caved</button>
              <button className="vg-link" onClick={() => setConfirmCave(false)}>Never mind</button>
            </div>
          </div>
        </div>
      )}

      {showReason && (
        <div className="vg-overlay" onClick={(e) => { if (e.target === e.currentTarget) setShowReason(false); }}>
          <div className="vg-card">
            <p className="vg-card-eyebrow">Your reason</p>
            <p className="vg-card-reason" style={{ fontSize: 19, marginBottom: 16 }}>When the urge hits, this is what Billie shows you. Why are you doing this?</p>
            <input className="vg-input" placeholder="e.g. I deserve someone who's sure about me." value={reasonDraft} onChange={(e) => setReasonDraft(e.target.value)} maxLength={140} />
            <div className="vg-card-actions">
              <button className="vg-btn vg-btn-primary" onClick={saveReason}>Save it</button>
              <button className="vg-link" onClick={() => setShowReason(false)}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      {showShare && (
        <div className="vg-overlay" onClick={(e) => { if (e.target === e.currentTarget) { setShowShare(false); if (shareUrl) { URL.revokeObjectURL(shareUrl); setShareUrl(""); } } }}>
          <div className="vg-card">
            <p className="vg-card-eyebrow">Share your climb</p>
            {shareUrl && <img src={shareUrl} alt="Your climb card" style={{ width: "100%", borderRadius: 12, marginBottom: 16, display: "block" }} />}
            <div className="vg-card-actions">
              <a className="vg-btn vg-btn-primary" href={shareUrl} download="my-climb.png" style={{ textDecoration: "none", textAlign: "center" }}>Download image</a>
              <button className="vg-link" onClick={copyCaption}>Copy caption</button>
              <button className="vg-link" onClick={() => { setShowShare(false); if (shareUrl) { URL.revokeObjectURL(shareUrl); setShareUrl(""); } }}>Close</button>
            </div>
          </div>
        </div>
      )}

      {toast && <div className="vg-toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
