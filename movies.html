<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Movies</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#fbfaf7; --ink:#1e1d1b; --muted:#8a857d; --rule:#e8e4dc;
    --link:#3b3f8f; --code-bg:#f1efe9; --grid:#d7d0c4;
    --measure:760px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Newsreader",Georgia,serif; font-size:19px; line-height:1.7;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; padding:0 20px;
  }
  .wrap{max-width:var(--measure); margin:0 auto; padding:32px 0 48px;}

  .masthead{margin-bottom:26px;}
  .masthead h1{font-family:"Fraunces",serif; font-weight:600; font-size:clamp(30px,6vw,44px); letter-spacing:-0.02em; line-height:1.05; margin:0;}
  .masthead p{margin:10px 0 0; color:var(--muted); font-style:italic; font-size:1.05rem;}
  .masthead .rule{height:1px; background:var(--rule); border:0; margin:18px 0 0;}

  h2.section{font-family:"Fraunces",serif; font-weight:600; font-size:1.5rem; letter-spacing:-0.01em; margin:28px 0 10px;}
  h2.section:first-of-type{margin-top:8px;}

  table{width:100%; border-collapse:collapse; margin:0; border:1px solid var(--grid);}
  thead th{text-align:left; font-family:"Fraunces",serif; font-weight:600; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); background:#f3efe8; padding:6px 10px; border:1px solid var(--grid);}
  thead th:last-child{text-align:right;}

  .film-row td{padding:9px 10px 4px; vertical-align:middle; border:1px solid var(--grid); border-bottom:0;}
  .film-row .t{font-family:"Fraunces",serif; font-weight:500; font-size:1.12rem; line-height:1.2;}
  .film-row .a{color:var(--muted); text-align:right; white-space:nowrap;}
  .detail-row td{padding:4px 10px 12px; border:1px solid var(--grid); border-top:0;}
  .review{margin:.15em 0 .55em;}
  .review a{color:var(--link); text-decoration:underline; text-underline-offset:2px;}
  .review code{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.85em; background:var(--code-bg); padding:.1em .35em; border-radius:4px;}
  .lines{list-style:none; margin:0; padding:0;}
  .lines li{border-left:3px solid var(--rule); padding:1px 0 1px 14px; color:var(--muted); font-style:italic; margin:.35em 0;}

  .cover-wrap{display:flex; align-items:center; gap:12px;}
  .cover{width:40px; height:60px; object-fit:cover; border-radius:3px; box-shadow:0 1px 3px rgba(0,0,0,.3); background:var(--code-bg); flex:0 0 auto;}

  .state{color:var(--muted); font-style:italic;}
  .foot{margin-top:36px; padding-top:16px; border-top:1px solid var(--rule); color:var(--muted); font-size:.85rem;}
  @media (max-width:520px){ body{font-size:18px;} .wrap{padding:24px 0 36px;} thead th{font-size:.66rem;} }
</style>
</head>
<body>
  <div class="wrap">
    <!-- ▼ Edit your page name + tagline here. Everything below comes from movies.md. -->
    <header class="masthead">
      <h1>Movies</h1>
      <p>What we've watched, and what's next.</p>
      <hr class="rule" />
    </header>

    <main id="shelf"><p class="state">Loading…</p></main>

    <footer class="foot">Posters &amp; data via TMDB. This product uses the TMDB API but is not endorsed or certified by TMDB.</footer>
  </div>

<script>
(() => {
  // ▼ Paste your free TMDB API key (v3 auth) here — themoviedb.org → Settings → API. Posters won't load until you do.
  const TMDB_KEY = '06cf868a53dce6149194addbd212d29d';

  const shelf = document.getElementById('shelf');
  const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g,'<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');

  // A poster is fetched by IMDb ID (OMDb needs a lookup), so we render a placeholder
  // <img> and fill its src afterwards in loadPosters().
  function poster(imdb){
    const id = (imdb||'').trim();
    if(!/^tt\d+$/i.test(id)) return '';
    return '<img class="cover" data-imdb="'+id+'" alt="" loading="lazy">';
  }

  async function loadPosters(){
    if(!TMDB_KEY || TMDB_KEY === 'YOUR_TMDB_KEY') return;   // key not set yet06cf868a53dce6149194addbd212d29d') return;   // key not set yet
    const imgs = [...document.querySelectorAll('img.cover[data-imdb]')];
    const cache = {};
    for(const img of imgs){
      const id = img.getAttribute('data-imdb');
      try{
        if(!(id in cache)){
          const r = await fetch('https://api.themoviedb.org/3/find/' + encodeURIComponent(id) +
            '?external_source=imdb_id&api_key=' + encodeURIComponent(TMDB_KEY));
          const d = await r.json();
          // works for both films and TV: TMDB returns movie_results or tv_results
          const hit = (d && ((d.movie_results && d.movie_results[0]) || (d.tv_results && d.tv_results[0]))) || null;
          cache[id] = (hit && hit.poster_path) ? ('https://image.tmdb.org/t/p/w342' + hit.poster_path) : '';
        }
        if(cache[id]) img.src = cache[id]; else img.remove();
      }catch(_){ img.remove(); }
    }
  }

  // Parse movies.md into ordered sections (file order preserved).
  function parse(text){
    const lines = text.replace(/\r\n/g,'\n').split('\n');
    const sections = []; let cur=null, curFilm=null;
    const flush = () => { if(curFilm && cur){ curFilm.notes = curFilm.noteLines.join(' ').trim(); cur.films.push(curFilm); curFilm=null; } };
    for(const raw of lines){
      const line = raw.replace(/\s+$/,'');
      const h2 = line.match(/^##\s+(.*)/);
      if(h2){
        if(cur){ flush(); const p = h2[1].split('|').map(s=>s.trim()); curFilm={ title:p[0]||'', released:p[1]||'', imdb:p[2]||'', noteLines:[], lines:[] }; }
        continue;
      }
      const h1 = line.match(/^#\s+(.*)/);
      if(h1){ flush(); cur={ title:h1[1].trim(), films:[] }; sections.push(cur); continue; }
      if(!curFilm) continue;
      const fav = line.match(/^\s*-\s+(.*)/);
      if(fav){ curFilm.lines.push(fav[1].trim()); continue; }
      if(line.trim()==='') continue;
      curFilm.noteLines.push(line.trim());
    }
    flush();
    return sections.filter(s => s.films.length);
  }

  function render(sections){
    if(!sections.length){ shelf.innerHTML='<p class="state">No films yet — add some in movies.md.</p>'; return; }
    let h='';
    sections.forEach(sec=>{
      h+='<h2 class="section">'+esc(sec.title)+'</h2><table class="films"><thead><tr><th>Film</th><th>Released</th></tr></thead><tbody>';
      sec.films.forEach(m=>{
        h+='<tr class="film-row"><td class="t"><span class="cover-wrap">'+poster(m.imdb)+'<span class="ttl">'+esc(m.title)+'</span></span></td><td class="a">'+esc(m.released)+'</td></tr>';
        if(m.notes || m.lines.length){
          h+='<tr class="detail-row"><td colspan="2">';
          if(m.notes) h+='<p class="review">'+inline(m.notes)+'</p>';
          if(m.lines.length) h+='<ul class="lines">'+m.lines.map(l=>'<li>'+esc(l)+'</li>').join('')+'</ul>';
          h+='</td></tr>';
        }
      });
      h+='</tbody></table>';
    });
    shelf.innerHTML=h;
    loadPosters();
  }

  fetch('movies.md?t=' + Date.now(), { cache:'no-store' })
    .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
    .then(t => render(parse(t)))
    .catch(err => {
      shelf.innerHTML = '<p class="state">Couldn’t load <b>movies.md</b> (' + esc(err.message) + ').<br>' +
        'View this on your live site (browsers block reading the file off your local disk), ' +
        'and keep movies.md in the same folder as this page.</p>';
    });
})();
</script>
</body>
</html>
