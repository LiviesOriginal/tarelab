<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Jammin' in Miami</title>
<meta name="description" content="Happenings" />
<meta name="color-scheme" content="light" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --stock:#FFFFFF;
    --stock-2:#FFFFFF;
    --ink:#191A16;
    --green:#1B7A43;
    --orange:#F4671F;
    --rule:rgba(25,26,22,.22);
    --display:"Anton","Haettenschweiler","Impact",system-ui,sans-serif;
    --body:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--stock);
    color:var(--ink);
    font-family:var(--body);
    font-size:16px;
    line-height:1.45;
    padding-bottom:96px;
  }

  /* ---------- top bar ---------- */
  .bar{
    position:sticky;top:0;z-index:40;
    background:var(--stock);
    border-bottom:2px solid var(--ink);
    padding:12px 16px 0;
  }
  .bar-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .wordmark{
    font-family:var(--display);
    font-size:30px;line-height:.92;letter-spacing:.01em;
    text-transform:uppercase;margin:0;
  }
  .wordmark em{font-style:normal;color:var(--orange);mix-blend-mode:multiply}
  .whoami{
    font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    background:none;border:0;border-bottom:2px solid var(--green);
    color:var(--green);font-family:var(--body);font-weight:700;
    padding:2px 0;cursor:pointer;white-space:nowrap;
  }

  .tabs{display:flex;gap:0;margin-top:12px}
  .tab{
    flex:1;appearance:none;border:2px solid var(--ink);border-bottom:0;
    background:transparent;color:var(--ink);
    font-family:var(--display);text-transform:uppercase;
    font-size:17px;letter-spacing:.04em;
    padding:9px 6px 7px;cursor:pointer;
    transform:translateY(2px);
  }
  .tab + .tab{border-left:0}
  .tab[aria-selected="true"]{background:var(--ink);color:var(--stock)}
  .tab .count{font-family:var(--body);font-size:11px;font-weight:700;opacity:.65;margin-left:5px}

  /* ---------- composer ---------- */
  .wrap{max-width:640px;margin:0 auto;padding:0 16px}
  .compose{
    margin:18px 0 4px;border:2px solid var(--ink);background:var(--stock-2);
    padding:12px;
  }
  .compose h2{
    font-family:var(--display);text-transform:uppercase;font-size:13px;
    letter-spacing:.12em;margin:0 0 10px;color:var(--green);
  }
  .field{display:block;width:100%;margin-bottom:8px}
  input[type=text],input[type=url],input[type=date],input[type=time],textarea,select{
    width:100%;font-family:var(--body);font-size:15px;color:var(--ink);
    background:var(--stock);border:0;border-bottom:2px solid var(--rule);
    padding:8px 2px;border-radius:0;
  }
  select{
    appearance:none;cursor:pointer;font-weight:500;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),
                     linear-gradient(135deg,var(--ink) 50%,transparent 50%);
    background-position:calc(100% - 11px) 17px, calc(100% - 6px) 17px;
    background-size:5px 5px,5px 5px;
    background-repeat:no-repeat;
    padding-right:24px;
  }
  select:focus{outline:0;border-bottom-color:var(--green)}
  input:focus,textarea:focus{outline:0;border-bottom-color:var(--green);background:#fff}
  input::placeholder,textarea::placeholder{color:rgba(25,26,22,.42)}
  .duo{display:flex;gap:8px}
  .duo > *{flex:1;min-width:0}
  .post{
    width:100%;margin-top:4px;border:2px solid var(--ink);background:var(--orange);
    font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;
    font-size:16px;padding:11px;cursor:pointer;
    box-shadow:4px 4px 0 var(--ink);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .post:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
  .post[disabled]{opacity:.45;cursor:default;box-shadow:none}

  /* ---------- cards ---------- */
  .sect{
    font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;
    font-size:12px;margin:26px 0 12px;display:flex;align-items:center;gap:10px;
  }
  .sect::after{content:"";flex:1;height:2px;background:var(--ink)}

  .card{position:relative;margin-bottom:18px}
  .card .plate{
    position:absolute;inset:0;
    background:var(--green);mix-blend-mode:multiply;
    transform:translate(5px,5px);
    transition:transform .18s cubic-bezier(.2,.8,.2,1);
  }
  .card.ev .plate{background:var(--orange)}
  .card:hover .plate,.card:focus-within .plate{transform:translate(0,0)}
  .card .face{
    position:relative;background:var(--stock-2);
    border:2px solid var(--ink);padding:13px 14px;
  }
  .card.past{opacity:.5}
  .card.past .plate{background:var(--ink)}

  .kicker{
    font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    color:var(--green);margin-bottom:5px;display:flex;gap:8px;align-items:center;
  }
  .card.ev .kicker{color:var(--orange)}
  .card.past .kicker{color:var(--ink)}
  .ttl{
    font-family:var(--display);text-transform:uppercase;
    font-size:22px;line-height:1.04;letter-spacing:.01em;
    margin:0 0 6px;word-break:break-word;
  }
  .ttl a{color:var(--ink);text-decoration:none;border-bottom:3px solid var(--green)}
  .ttl a:hover{background:var(--green);color:var(--stock-2);border-color:var(--ink)}
  .host{font-size:13px;word-break:break-all;opacity:.6;margin:0 0 6px}
  .note{font-size:14px;margin:0 0 8px;white-space:pre-wrap}
  .meta{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    border-top:2px solid var(--rule);padding-top:8px;margin-top:8px;
  }
  .meta .by{font-weight:700}
  .kill{
    background:none;border:0;font:inherit;color:var(--ink);opacity:.45;
    cursor:pointer;letter-spacing:.06em;padding:2px 0;
  }
  .kill:hover{opacity:1;color:var(--orange)}

  /* ---------- rsvp ---------- */
  .rsvp{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
  .im-in{
    border:2px solid var(--ink);background:var(--stock);
    font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;
    font-size:14px;padding:7px 14px;cursor:pointer;
    box-shadow:3px 3px 0 var(--ink);
  }
  .im-in:active{transform:translate(3px,3px);box-shadow:none}
  .im-in.on{background:var(--orange)}
  .going{display:flex;gap:5px;flex-wrap:wrap}
  .chip{
    font-size:11px;font-weight:700;letter-spacing:.04em;
    border:2px solid var(--ink);padding:2px 7px;background:var(--stock);
  }
  .nobody{font-size:12px;opacity:.55}

  /* ---------- calendar ---------- */

  .cal{border:2px solid var(--ink);background:var(--stock-2);margin-top:12px}
  .cal-head{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:9px 10px;border-bottom:2px solid var(--ink);
  }
  .cal-mon{font-family:var(--display);text-transform:uppercase;font-size:18px;letter-spacing:.04em}
  .cal-nav{display:flex;gap:6px}
  .cal-nav button{
    width:32px;height:32px;border:2px solid var(--ink);background:var(--stock);
    font-family:var(--display);font-size:15px;line-height:1;cursor:pointer;color:var(--ink);
  }
  .cal-nav button:active{background:var(--orange)}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:2px solid var(--rule)}
  .dow span{
    padding:6px 0;text-align:center;font-size:10px;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;opacity:.55;
  }
  .grid{display:grid;grid-template-columns:repeat(7,1fr)}
  .cell{
    position:relative;min-height:112px;padding:6px 5px;text-align:left;
    border:0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
    background:transparent;font:inherit;color:var(--ink);cursor:pointer;
    overflow:hidden;
  }
  .cell:hover{background:rgba(244,103,31,.14)}
  .cell:nth-child(7n){border-right:0}
  .cell.out{opacity:.28}
  .cell .d{font-size:12px;font-weight:700;line-height:1.5}
  .cell.today .d{
    background:var(--orange);border:2px solid var(--ink);
    padding:0 5px;display:inline-block;line-height:1.3;
  }
  .cell.has:hover{background:rgba(244,103,31,.18)}
  .cell.sel{background:rgba(27,122,67,.2);box-shadow:inset 0 0 0 3px var(--ink)}
  .dots{display:flex;flex-direction:column;gap:3px;margin-top:5px}
  .dot{
    display:flex;align-items:center;gap:3px;
    font-size:9.5px;font-weight:700;line-height:1.3;
    background:var(--orange);color:var(--ink);border:1px solid var(--ink);
    padding:1px 3px;overflow:hidden;
  }
  .dot .em{font-size:11px;line-height:1;flex:none}
  .dot .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .dot.gone{background:transparent;border-color:var(--rule);opacity:.5}
  .more{display:block;font-size:9px;font-weight:700;opacity:.6;margin-top:3px;letter-spacing:.04em}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;font-weight:700;opacity:.75}
  .legend span{white-space:nowrap;letter-spacing:.04em}
  .cal-foot{
    padding:10px 12px;border-top:2px solid var(--ink);
    font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.6;
  }
  .day-head{
    font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;
    font-size:12px;margin:22px 0 12px;display:flex;align-items:center;gap:10px;
  }
  .day-head::after{content:"";flex:1;height:2px;background:var(--ink)}

  /* ---------- dialog ---------- */
  .veil{
    position:fixed;inset:0;z-index:100;
    background:rgba(25,26,22,.55);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .dialog{
    background:#fff;border:2px solid var(--ink);box-shadow:7px 7px 0 var(--ink);
    padding:18px;width:100%;max-width:360px;
  }
  .dialog h2{
    font-family:var(--display);text-transform:uppercase;letter-spacing:.03em;
    font-size:22px;margin:0 0 6px;
  }
  .dialog p{font-size:13px;margin:0 0 14px;opacity:.7}
  .kill.armed{opacity:1;color:var(--orange);font-weight:700}

  /* ---------- states ---------- */
  .empty{
    border:2px dashed var(--ink);padding:26px 18px;text-align:center;
    font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;
    font-size:15px;line-height:1.3;opacity:.7;
  }
  .status{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:var(--ink);color:var(--stock);
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:9px 16px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  }
  .status button{
    background:none;border:2px solid var(--stock);color:var(--stock);
    font:inherit;letter-spacing:.08em;padding:4px 10px;cursor:pointer;
  }
  .warn{color:var(--orange)}
  .hide{display:none !important}
  @media (max-width:520px){
    .cell{min-height:96px;padding:5px 3px}
    .dot{justify-content:center;padding:2px 1px}
    .dot .tx{display:none}
    .dot .em{font-size:12px}
    .more{font-size:8px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important}
  }
</style>
</head>
<body>

<header class="bar">
  <div class="wrap" style="padding:0">
    <div class="bar-row">
      <h1 class="wordmark">Jammin in <em>Miami</em></h1>
      <button class="whoami" id="whoami">set your name</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" id="nav-month" role="tab" aria-selected="true">Month</button>
      <button class="tab" id="nav-list" role="tab" aria-selected="false">List <span class="count" id="c-list"></span></button>
      <button class="tab" id="nav-links" role="tab" aria-selected="false">Links <span class="count" id="c-links"></span></button>
    </div>
  </div>
</header>

<main class="wrap">

  <!-- EVENTS -->
  <section id="pane-events" class="hide">
    <div id="calendar" class="hide"></div>
    <div id="list-events"></div>

    <div class="compose">
      <h2>Add an event</h2>
      <input class="field" type="text" id="e-title" placeholder="What's happening?" />
      <div class="duo">
        <input type="date" id="e-date" />
        <input type="time" id="e-time" />
      </div>
      <input class="field" type="text" id="e-place" placeholder="Where — optional" style="margin-top:8px" />
      <input class="field" type="text" id="e-note" placeholder="Note or link — optional" />
      <button class="post" id="e-post">Pin It</button>
    </div>
  </section>

  <!-- LINKS -->
  <section id="pane-links" class="hide">
    <div class="compose">
      <h2>Pin a link</h2>
      <input class="field" type="url" id="l-url" placeholder="https://…" inputmode="url" />
      <input class="field" type="text" id="l-title" placeholder="What is it? (title)" />
      <input class="field" type="text" id="l-note" placeholder="Note — optional" />
      <button class="post" id="l-post">Pin it</button>
    </div>
    <div id="list-links"></div>
  </section>

</main>

<div class="veil hide" id="veil">
  <div class="dialog">
    <h2 id="dlg-title">Who are you?</h2>
    <p id="dlg-blurb">Shown on what you post and on RSVPs. Saved on this device only — no account.</p>
    <input class="field" type="text" id="dlg-input" maxlength="40" placeholder="Your name" />
    <button class="post" id="dlg-save">Save</button>
  </div>
</div>

<div class="status">
  <span id="status-txt">Loading the board…</span>
  <button id="refresh">Refresh</button>
</div>

<script>
(function(){
  "use strict";

  var API = "/api/board";
  var POLL_MS = 15000;

  var state = { links: [], events: [] };
  var me = "";
  var pass = "";
  var mode = "month";               // "month" | "list" | "links"
  var busy = false;
  var cursor = new Date(); cursor.setDate(1);
  var picked = null;                // "YYYY-MM-DD" selected in month view

  var $ = function(id){ return document.getElementById(id); };

  /* ---------- local prefs (name, passcode) ----------
     This is a normal website, so localStorage is fine here. It only ever
     holds this browser's own name + passcode — never board content. */
  function lget(k){ try { return localStorage.getItem(k) || ""; } catch(e){ return ""; } }
  function lset(k,v){ try { localStorage.setItem(k,v); } catch(e){} }

  /* ---------- helpers ---------- */
  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function safeUrl(u){
    u = String(u || "").trim();
    if(!u) return "";
    if(!/^https?:\/\//i.test(u)) u = "https://" + u;
    try { var p = new URL(u); return (p.protocol === "http:" || p.protocol === "https:") ? p.href : ""; }
    catch(e){ return ""; }
  }
  function host(u){ try { return new URL(u).hostname.replace(/^www\./,""); } catch(e){ return ""; } }
  function ago(ts){
    var s = Math.floor((Date.now() - ts)/1000);
    if(s < 60) return "just now";
    if(s < 3600) return Math.floor(s/60) + "m ago";
    if(s < 86400) return Math.floor(s/3600) + "h ago";
    return Math.floor(s/86400) + "d ago";
  }
  function ymd(d){
    return d.getFullYear() + "-" +
      String(d.getMonth()+1).padStart(2,"0") + "-" +
      String(d.getDate()).padStart(2,"0");
  }
  function whenText(ev){
    var d = new Date(ev.date + "T" + (ev.time || "12:00"));
    if(isNaN(d)) return ev.date || "";
    var day = d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
    return ev.time ? day + " \u00B7 " + d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}) : day;
  }
  function isPast(ev){
    var d = new Date(ev.date + "T" + (ev.time || "23:59"));
    return !isNaN(d) && d.getTime() < Date.now();
  }
  function say(msg, warn){
    var el = $("status-txt");
    el.textContent = msg;
    el.className = warn ? "warn" : "";
  }

  /* ---------- dialog ---------- */
  var pending = null;
  function ask(opts){
    return new Promise(function(resolve){
      pending = resolve;
      $("dlg-title").textContent = opts.title;
      $("dlg-blurb").textContent = opts.blurb;
      $("dlg-input").type = opts.password ? "password" : "text";
      $("dlg-input").placeholder = opts.placeholder;
      $("dlg-input").value = opts.value || "";
      $("veil").classList.remove("hide");
      setTimeout(function(){ $("dlg-input").focus(); }, 0);
    });
  }
  function closeDialog(val){
    $("veil").classList.add("hide");
    if(pending){ var r = pending; pending = null; r(val); }
  }
  $("dlg-save").addEventListener("click", submitDialog);
  $("dlg-input").addEventListener("keydown", function(e){
    if(e.key === "Enter") submitDialog();
  });
  function submitDialog(){
    var v = $("dlg-input").value.trim();
    if(!v){ $("dlg-input").focus(); return; }
    closeDialog(v);
  }

  async function needName(){
    if(me) return me;
    var n = await ask({
      title: "Who are you?",
      blurb: "Shown on what you post and on RSVPs. Saved on this device only \u2014 no account.",
      placeholder: "Your name",
      value: ""
    });
    me = n.slice(0,24);
    lset("board:name", me);
    paintMe();
    render();
    return me;
  }
  async function needPass(){
    var p = await ask({
      title: "Passcode",
      blurb: "This board is passcode-protected. Ask whoever shared the link.",
      placeholder: "Passcode",
      password: true
    });
    pass = p;
    lset("board:pass", pass);
    return pass;
  }
  function paintMe(){ $("whoami").textContent = me ? me : "set your name"; }

  /* ---------- api ---------- */
  function headers(){
    var h = { "content-type": "application/json" };
    if(pass) h["x-board-pass"] = pass;
    return h;
  }

  async function call(method, body){
    var res = await fetch(API, {
      method: method,
      headers: headers(),
      body: body ? JSON.stringify(body) : undefined
    });
    if(res.status === 401){
      await needPass();
      // retry once with the passcode we just collected
      res = await fetch(API, {
        method: method,
        headers: headers(),
        body: body ? JSON.stringify(body) : undefined
      });
      if(res.status === 401) throw new Error("wrong passcode");
    }
    var data = null;
    try { data = await res.json(); } catch(e){}
    if(!res.ok) throw new Error((data && data.error) || ("HTTP " + res.status));
    return data;
  }

  function adopt(data){
    if(!data) return;
    state = { links: data.links || [], events: data.events || [] };
    render();
  }

  async function pull(quiet){
    try{
      adopt(await call("GET"));
      if(!quiet) say("Board is live \u00B7 everyone with this link sees it");
    }catch(e){
      say("Can't reach the board: " + e.message, true);
    }
  }

  async function send(body){
    if(busy) return false;
    busy = true;
    say("Saving\u2026");
    try{
      adopt(await call("POST", body));
      say("Saved \u00B7 everyone with this link sees it");
      busy = false;
      return true;
    }catch(e){
      say("SAVE FAILED: " + e.message, true);
      busy = false;
      return false;
    }
  }

  /* ---------- render ---------- */
  function render(){
    $("c-links").textContent = state.links.length ? "(" + state.links.length + ")" : "";
    var up = state.events.filter(function(e){ return !isPast(e); }).length;
    $("c-list").textContent = up ? "(" + up + ")" : "";
    if(mode === "links"){ renderLinks(); return; }
    if(mode === "month"){ renderCalendar(); renderPicked(); }
    else { renderEvents(); }
  }

  function renderLinks(){
    var box = $("list-links");
    var items = state.links.slice().sort(function(a,b){ return b.ts - a.ts; });
    if(!items.length){
      box.innerHTML = '<div class="empty">Nothing pinned yet.<br>Paste the first link above.</div>';
      return;
    }
    box.innerHTML = '<div class="sect">Pinned</div>' + items.map(function(it){
      return '<article class="card">' +
        '<div class="plate"></div>' +
        '<div class="face">' +
          '<div class="kicker"><span>Link</span><span>\u00B7</span><span>' + esc(ago(it.ts)) + '</span></div>' +
          '<h3 class="ttl"><a href="' + esc(it.url) + '" target="_blank" rel="noopener noreferrer">' +
            esc(it.title || host(it.url) || it.url) + '</a></h3>' +
          '<p class="host">' + esc(host(it.url)) + '</p>' +
          (it.note ? '<p class="note">' + esc(it.note) + '</p>' : '') +
          '<div class="meta"><span class="by">' + esc(it.by || "anon") + '</span>' +
            '<button class="kill" data-kill-link="' + esc(it.id) + '">Remove</button></div>' +
        '</div></article>';
    }).join("");
  }

  function renderEvents(){
    var box = $("list-events");
    if(!state.events.length){
      box.innerHTML = '<div class="empty">No events on the board.<br>Add the first one below.</div>';
      return;
    }
    var upcoming = state.events.filter(function(e){ return !isPast(e); })
      .sort(function(a,b){ return (a.date + (a.time||"")).localeCompare(b.date + (b.time||"")); });
    var past = state.events.filter(isPast)
      .sort(function(a,b){ return (b.date + (b.time||"")).localeCompare(a.date + (a.time||"")); });

    var html = "";
    if(upcoming.length) html += '<div class="sect">Coming up</div>' + upcoming.map(function(e){ return evCard(e, false); }).join("");
    if(past.length) html += '<div class="sect">Been and gone</div>' + past.map(function(e){ return evCard(e, true); }).join("");
    box.innerHTML = html;
  }

  function renderCalendar(){
    var box = $("calendar");
    var y = cursor.getFullYear(), m = cursor.getMonth();
    var first = new Date(y, m, 1);
    var start = new Date(y, m, 1 - first.getDay());   // back up to Sunday
    var today = ymd(new Date());

    var byDay = {};
    state.events.forEach(function(ev){
      if(!ev.date) return;
      (byDay[ev.date] = byDay[ev.date] || []).push(ev);
    });

    var cells = "";
    for(var i = 0; i < 42; i++){
      var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      var key = ymd(d);
      var evs = byDay[key] || [];
      var cls = ["cell"];
      if(d.getMonth() !== m) cls.push("out");
      if(key === today) cls.push("today");
      if(evs.length) cls.push("has");
      if(key === picked) cls.push("sel");
      var labels = evs.slice(0,3).map(function(ev){
        return '<span class="dot' + (isPast(ev) ? " gone" : "") + '">' + esc(ev.title) + '</span>';
      }).join("");
      if(evs.length > 3) labels += '<span class="more">+' + (evs.length - 3) + ' more</span>';
      cells += '<button class="' + cls.join(" ") + '" data-day="' + key + '"' +
        ' aria-label="' + key + ', ' + evs.length + ' events">' +
        '<span class="d">' + d.getDate() + '</span>' +
        (labels ? '<span class="dots">' + labels + '</span>' : '') +
        '</button>';
    }

    var upcoming = state.events.filter(function(e){ return !isPast(e); }).length;
    box.innerHTML =
      '<div class="cal">' +
        '<div class="cal-head">' +
          '<span class="cal-mon">' + first.toLocaleDateString(undefined,{month:"long",year:"numeric"}) + '</span>' +
          '<span class="cal-nav">' +
            '<button id="cal-prev" aria-label="Previous month">&#8592;</button>' +
            '<button id="cal-today" aria-label="This month" style="width:auto;padding:0 10px;font-size:12px;letter-spacing:.06em">Today</button>' +
            '<button id="cal-next" aria-label="Next month">&#8594;</button>' +
          '</span>' +
        '</div>' +
        '<div class="dow"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>' +
        '<div class="grid">' + cells + '</div>' +
        '<div class="cal-foot">' + (upcoming ? "Tap a day to see what\u2019s on" : "Nothing coming up") + '</div>' +
      '</div>';

    $("cal-prev").addEventListener("click", function(){ cursor.setMonth(cursor.getMonth()-1); renderCalendar(); });
    $("cal-next").addEventListener("click", function(){ cursor.setMonth(cursor.getMonth()+1); renderCalendar(); });
    $("cal-today").addEventListener("click", function(){
      cursor = new Date(); cursor.setDate(1);
      picked = ymd(new Date());
      renderCalendar(); renderPicked();
    });
  }

  function renderPicked(){
    var box = $("list-events");
    if(!picked){ box.innerHTML = ""; return; }
    var d = new Date(picked + "T12:00");
    var isToday = picked === ymd(new Date());
    var evs = state.events.filter(function(e){ return e.date === picked; })
      .sort(function(a,b){ return (a.time||"").localeCompare(b.time||""); });

    var head = '<div class="day-head">' + (isToday ? "Today \u00B7 " : "") +
      d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}) + '</div>';

    box.innerHTML = head + (evs.length
      ? evs.map(function(e){ return evCard(e, isPast(e)); }).join("")
      : '<div class="empty">Nothing on this day.<br>Add something below.</div>');
  }

  function evCard(ev, gone){
    var going = ev.going || [];
    var iam = me && going.indexOf(me) !== -1;
    var chips = going.length
      ? '<div class="going">' + going.map(function(n){ return '<span class="chip">' + esc(n) + '</span>'; }).join("") + '</div>'
      : '<span class="nobody">No one in yet</span>';
    return '<article class="card ev' + (gone ? ' past' : '') + '">' +
      '<div class="plate"></div>' +
      '<div class="face">' +
        '<div class="kicker"><span>' + esc(whenText(ev)) + '</span>' +
          (ev.place ? '<span>\u00B7</span><span>' + esc(ev.place) + '</span>' : '') + '</div>' +
        '<h3 class="ttl">' + esc(ev.title) + '</h3>' +
        (ev.note ? '<p class="note">' + esc(ev.note) + '</p>' : '') +
        (gone ? '' :
          '<div class="rsvp">' +
            '<button class="im-in' + (iam ? ' on' : '') + '" data-rsvp="' + esc(ev.id) + '">' +
              (iam ? "You\u2019re in \u2713" : "I\u2019m in") + '</button>' + chips +
          '</div>') +
        '<div class="meta"><span class="by">Added by ' + esc(ev.by || "anon") + '</span>' +
          '<button class="kill" data-kill-event="' + esc(ev.id) + '">Remove</button></div>' +
      '</div></article>';
  }

  /* ---------- actions ---------- */
  $("l-post").addEventListener("click", async function(){
    var url = safeUrl($("l-url").value);
    if(!url){ $("l-url").focus(); say("That doesn't look like a link.", true); return; }
    var name = await needName();
    if(!name) return;
    var ok = await send({
      action: "add_link", url: url,
      title: $("l-title").value.trim(),
      note: $("l-note").value.trim(),
      by: name
    });
    if(!ok) return;
    $("l-url").value = ""; $("l-title").value = ""; $("l-note").value = "";
  });

  $("e-post").addEventListener("click", async function(){
    var title = $("e-title").value.trim();
    var date = $("e-date").value;
    if(!title){ $("e-title").focus(); say("Give the event a name.", true); return; }
    if(!date){ $("e-date").focus(); say("Pick a date.", true); return; }
    var name = await needName();
    if(!name) return;
    var ok = await send({
      action: "add_event", title: title, date: date,
      time: $("e-time").value || "",
      place: $("e-place").value.trim(),
      note: $("e-note").value.trim(),
      by: name
    });
    if(!ok) return;
    $("e-title").value = ""; $("e-time").value = "";
    $("e-place").value = ""; $("e-note").value = "";
    picked = date;
    cursor = new Date(date + "T12:00"); cursor.setDate(1);
    if(mode === "month"){ renderCalendar(); renderPicked(); }
  });

  document.addEventListener("click", async function(e){
    var day = e.target.closest("[data-day]");
    if(day){
      picked = day.getAttribute("data-day");
      renderCalendar();
      renderPicked();
      return;
    }

    var t = e.target.closest("[data-rsvp],[data-kill-link],[data-kill-event]");
    if(!t) return;

    if(t.hasAttribute("data-rsvp")){
      var name = await needName();
      if(!name) return;
      await send({ action: "toggle_rsvp", id: t.getAttribute("data-rsvp"), by: name });
      return;
    }

    // Two-step delete: first tap arms the button, second tap commits.
    if(t.dataset.armed !== "1"){
      t.dataset.armed = "1";
      t.textContent = "Sure? Tap again";
      t.classList.add("armed");
      setTimeout(function(){
        if(t.isConnected && t.dataset.armed === "1"){
          t.dataset.armed = "0";
          t.textContent = "Remove";
          t.classList.remove("armed");
        }
      }, 4000);
      return;
    }
    if(t.hasAttribute("data-kill-link")){
      await send({ action: "remove_link", id: t.getAttribute("data-kill-link") });
    } else {
      await send({ action: "remove_event", id: t.getAttribute("data-kill-event") });
    }
  });

  function setMode(m){
    mode = m;
    ["month","list","links"].forEach(function(k){
      $("nav-" + k).setAttribute("aria-selected", String(k === m));
    });
    $("pane-links").classList.toggle("hide", m !== "links");
    $("pane-events").classList.toggle("hide", m === "links");
    $("calendar").classList.toggle("hide", m !== "month");
    if(m === "month" && !picked) picked = ymd(new Date());
    if(m === "list") picked = null;
    render();
  }
  $("nav-month").addEventListener("click", function(){ setMode("month"); });
  $("nav-list").addEventListener("click", function(){ setMode("list"); });
  $("nav-links").addEventListener("click", function(){ setMode("links"); });
  $("whoami").addEventListener("click", async function(){
    var n = await ask({
      title: "Your name",
      blurb: "Shown on what you post and on RSVPs. Saved on this device only.",
      placeholder: "Your name",
      value: me
    });
    me = n.slice(0,24);
    lset("board:name", me);
    paintMe();
    render();
  });
  $("refresh").addEventListener("click", function(){ pull(false); });

  document.addEventListener("visibilitychange", function(){
    if(!document.hidden) pull(true);
  });
  setInterval(function(){ if(!document.hidden && !busy) pull(true); }, POLL_MS);

  (function init(){
    me = lget("board:name");
    pass = lget("board:pass");
    paintMe();
    picked = ymd(new Date());
    $("e-date").value = picked;
    setMode("month");
    pull(false);
  })();
})();
</script>
</body>
</html>
